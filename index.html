function renderTable(){
  const events = store.get('events', []), tasks = store.get('tasks', []);
  const tabs = ['All','Upcoming','Live','Completed','Cancelled'];
  const match = (e, f) => f==='All' ? true : f==='Upcoming' ? (daysUntil(e.date)>=0 && ['Planning','Confirmed'].includes(e.status)) : e.status===f;
  document.getElementById('tabs').innerHTML = tabs.map(t => `<button class="${t===tableFilter?'on':''}" data-tab="${t}">${t}<span>${events.filter(e=>match(e,t)).length}</span></button>`).join('');
  const q = tableQuery.trim().toLowerCase();
  const rows = events.filter(e => match(e, tableFilter))
    .filter(e => !q || [e.name,e.client,e.venue,e.type,e.status].join(' ').toLowerCase().includes(q))
    .sort((a,b) => { const da=daysUntil(a.date), db=daysUntil(b.date); return (da<0)-(db<0) || (da<0 ? db-da : da-db); });

  document.getElementById('tblWrap').innerHTML = eventsTable(rows, tasks);
}

function renderCalendar(events){
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const first = new Date(y, m, 1), startDay = (first.getDay()+6)%7; // Monday first
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const byDate = {};
  events.filter(e=>e.status!=='Cancelled').forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));
  let cells = '';
  for(let i=0;i<startDay;i++) cells += `<div class="d muted">${prevDays-startDay+i+1}</div>`;
  for(let d=1; d<=daysInMonth; d++){
    const key = iso(new Date(y,m,d)), evs = byDate[key] || [];
    const isToday = key===iso(TODAY);
    cells += `<div class="d ${isToday?'today':''} ${evs.length?'has':''}" ${evs.length?`title="${esc(evs.map(e=>e.name).join(', '))}"`:''}>${d}${evs.length?`<span class="dots">${evs.slice(0,3).map(e=>`<i style="background:${TYPE_COLORS[e.type]||TYPE_COLORS.Other}"></i>`).join('')}</span>`:''}</div>`;
  }
  const total = startDay + daysInMonth, trailing = (7 - total%7)%7;
  for(let i=1;i<=trailing;i++) cells += `<div class="d muted">${i}</div>`;
  const monthEvents = events.filter(e => e.status!=='Cancelled' && parse(e.date).getMonth()===m && parse(e.date).getFullYear()===y).length;
  document.getElementById('calPanel').innerHTML = `
    <div class="cal-head"><div><b>${calCursor.toLocaleDateString('en-GB',{month:'long', year:'numeric'})}</b><div style="font-size:12px;color:var(--muted)">${monthEvents} event${monthEvents!==1?'s':''} this month</div></div>
      <div class="cal-nav"><button id="calPrev" aria-label="Previous month">${ic('chevL')}</button><button id="calNext" aria-label="Next month">${ic('chevR')}</button></div></div>
    <div class="cal">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<div class="dn">${d}</div>`).join('')}${cells}</div>`;
  document.getElementById('calPrev').onclick = () => { calCursor = new Date(y, m-1, 1); renderCalendar(store.get('events',[])); };
  document.getElementById('calNext').onclick = () => { calCursor = new Date(y, m+1, 1); renderCalendar(store.get('events',[])); };
}

function drawCharts(events){
  const active = events.filter(e => e.status!=='Cancelled');
  // type list (works even if Chart.js fails)
  const types = {}; active.forEach(e => types[e.type] = (types[e.type]||0)+1);
  const tKeys = Object.keys(types).sort((a,b)=>types[b]-types[a]);
  document.getElementById('typeList').innerHTML = tKeys.map(k => `<div><i style="background:${TYPE_COLORS[k]||TYPE_COLORS.Other}"></i>${k}<b>${types[k]}</b></div>`).join('');
  if(typeof Chart === 'undefined') return;

  const dark = document.documentElement.dataset.theme==='dark';
  const grid = dark ? 'rgba(255,255,255,.06)' : 'rgba(60,30,70,.07)';
  const tick = dark ? '#a39aab' : '#7c7284';
  Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

  // months window: 5 back, 6 forward
  const labels = [], proj = [], coll = [];
  for(let i=-5;i<=6;i++){
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth()+i, 1);
    labels.push(d.toLocaleDateString('en-GB',{month:'short'}) + (d.getMonth()===0 || i===-5 ? " '"+String(d.getFullYear()).slice(2) : ''));
    const inMonth = active.filter(e => { const x = parse(e.date); return x.getMonth()===d.getMonth() && x.getFullYear()===d.getFullYear(); });
    proj.push(inMonth.reduce((s,e)=>s+e.budget,0));
    coll.push(inMonth.reduce((s,e)=>s+e.collected,0));
  }
  const ctx = document.getElementById('revChart').getContext('2d');
  const gEm = ctx.createLinearGradient(0,0,0,260); gEm.addColorStop(0,'#14b88b'); gEm.addColorStop(1,'#0b7a5d');
  charts.push(new Chart(ctx, {
    type:'bar',
    data:{labels, datasets:[
      {label:'Projected', data:proj, backgroundColor: dark ? '#5a3a68' : '#dcc6e5', borderRadius:7, barPercentage:.75, categoryPercentage:.6},
      {label:'Collected', data:coll, backgroundColor:gEm, borderRadius:7, barPercentage:.75, categoryPercentage:.6}
    ]},
    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
      plugins:{legend:{display:false}, tooltip:{backgroundColor:'#1c1a20', padding:12, cornerRadius:10, callbacks:{label:c=>' '+c.dataset.label+': '+money(c.raw)}}},
      scales:{x:{grid:{display:false}, ticks:{color:tick, font:{size:11}}, border:{display:false}},
              y:{grid:{color:grid}, border:{display:false}, ticks:{color:tick, font:{size:11}, callback:v=>moneyShort(v)}}}}
  }));

  charts.push(new Chart(document.getElementById('typeChart'), {
    type:'doughnut',
    data:{labels:tKeys, datasets:[{data:tKeys.map(k=>types[k]), backgroundColor:tKeys.map(k=>TYPE_COLORS[k]||TYPE_COLORS.Other), borderWidth:3, borderColor: dark ? '#1c1920' : '#fff', hoverOffset:6, borderRadius:6, spacing:2}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'72%', plugins:{legend:{display:false}, tooltip:{backgroundColor:'#1c1a20', padding:10, cornerRadius:10}}}
  }));
}

function matchStatus(e, f){ return f==='All' ? true : f==='Upcoming' ? (daysUntil(e.date)>=0 && ['Planning','Confirmed'].includes(e.status)) : e.status===f; }
function sortEvents(list, mode, tasks){
  const by = {
    'date-asc': (a,b) => { const da=daysUntil(a.date), db=daysUntil(b.date); return (da<0)-(db<0) || (da<0 ? db-da : da-db); },
    'date-desc':(a,b) => b.date.localeCompare(a.date),
    'budget':   (a,b) => b.budget - a.budget,
    'name':     (a,b) => a.name.localeCompare(b.name),
    'health':   (a,b) => health(a,tasks) - health(b,tasks)
  };
  return [...list].sort(by[mode] || by['date-asc']);
}

        <td><div class="hbar"><div class="mini-bar"><div style="width:${h}%;background:${healthColor(h)}"></div></div><b>${e.status==='Cancelled'?'—':h+'%'}</b></div></td>

const fmtTime = t => { if(!t) return ''; const [h,m] = t.split(':').map(Number); return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`; };

function renderEventsBody(){
  const tasks = getTasks();
  const q = evQuery.trim().toLowerCase();
  let list = getEvents().filter(e => evType==='All' || e.type===evType)
    .filter(e => !q || [e.name,e.client,e.venue,e.type,e.status].join(' ').toLowerCase().includes(q));
  const tabs = ['All','Upcoming','Planning','Confirmed','Live','Completed','Cancelled'];
  document.getElementById('evTabs').innerHTML = tabs.map(t => `<button class="${t===evStatus?'on':''}" data-evtab="${t}">${t}<span>${list.filter(e=>matchStatus(e,t)).length}</span></button>`).join('');
  const body = document.getElementById('evBody');

  if(!getEvents().length){
    body.innerHTML = `<div class="ph"><div class="chip t-rose">${ic('events')}</div><h3>No events yet</h3><p>Create your first event to start planning.</p><button class="btn btn-primary" data-new style="margin-top:18px">${ic('plus')}Create event</button></div>`;
    return;
  }
  if(evView==='board'){ body.innerHTML = boardHTML(list, tasks); return; }
  list = sortEvents(list.filter(e => matchStatus(e, evStatus)), evSort, tasks);
  if(!list.length){ body.innerHTML = `<div class="panel empty">No events match your filters.</div>`; return; }
  body.innerHTML = evView==='cards' ? cardsHTML(list, tasks) : `<div class="panel"><div class="tbl-wrap" style="margin:-20px">${eventsTable(list, tasks)}</div></div>`;
}

/* ---------- Drag & drop (kanban) ---------- */
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.k-card'); if(!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed='move'; c.classList.add('dragging'); });
document.addEventListener('dragend', () => { document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging','over')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.k-col'); if(!col) return; e.preventDefault(); document.querySelectorAll('.k-col.over').forEach(x => x!==col && x.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('.k-col'); if(!col) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); col.classList.remove('over'); if(id){ col.dataset.kind==='lead' ? setLeadStage(id, col.dataset.status) : setStatus(id, col.dataset.status); } });

function setStatus(id, status){
  const events = getEvents(), e = events.find(x=>x.id===id);
  if(!e || e.status===status) return;
  e.status = status; saveEvents(events);
  toast(`“${esc(e.name)}” moved to ${status}`);
  refresh();
}

        ${fld('Venue','venue',v.venue,'text','placeholder="Venue or location" maxlength="80" list="venueList" autocomplete="off"')}<datalist id="venueList">${store.get('venues',[]).map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
        ${fld('Event date *','date',v.date,'date')}
        ${fld('Start time','time',v.time||'','time')}

        ${fld(`Total budget (${CUR})`,'budget',v.budget,'number','min="0" step="1000" placeholder="0"')}
        ${(e && store.get('payments',[]).some(p=>p.eventId===e.id)) ? fld(`Amount collected (${CUR})`,'collected',v.collected,'number','readonly title="Updated automatically from Payments & Invoices" style="opacity:.7"').replace('<small class="err"></small>','<small style="font-size:11.5px;color:var(--muted)">Updated automatically from recorded payments</small><small class="err"></small>') : fld(`Amount collected (${CUR})`,'collected',v.collected,'number','min="0" step="1000" placeholder="0"')}
        ${fld('Guests invited','invited',v.invited,'number','min="0" placeholder="0"')}
        ${fld('Guests confirmed','confirmed',v.confirmed,'number','min="0" placeholder="0"')}
        <div class="field full"><label for="f_notes">Notes</label><textarea id="f_notes" name="notes" maxlength="1000" placeholder="Special requests, theme ideas, client preferences…">${esc(v.notes||'')}</textarea></div>
      </div>
      ${e ? '' : `<div class="switch-row" style="flex-wrap:wrap;cursor:default"><label style="display:flex;align-items:center;gap:12px;flex:1;min-width:220px;cursor:pointer"><input type="checkbox" name="useTpl" ${v.noTpl?'':'checked'}><span class="switch"></span><div><b>Apply a template</b><span id="tplHint"></span></div></label><select class="sel" name="tplId" id="tplSel" style="max-width:260px;background-color:var(--surface)"></select></div>`}

  const form = document.getElementById('evForm');
  let tplPicked = v.tplId || '';
  const hint = () => {
    const h = document.getElementById('tplHint'), sel = document.getElementById('tplSel'); if(!h || !sel) return;
    const t = form.type.value, all = getTemplates();
    const mine = all.filter(x=>x.type===t), others = all.filter(x=>x.type!==t);

  form.addEventListener('submit', ev => { ev.preventDefault(); saveEventForm(form, e); });

function saveEventForm(form, existing){
  const f = n => form.elements[n];
  const num = n => Math.max(0, Number(f(n).value) || 0);
  form.querySelectorAll('.field').forEach(x => { x.classList.remove('invalid'); const er = x.querySelector('.err'); if(er) er.textContent=''; });
  const errs = [];
  const fail = (n, msg) => { const box = f(n).closest('.field'); box.classList.add('invalid'); box.querySelector('.err').textContent = msg; errs.push(n); };
  if(!f('name').value.trim()) fail('name','Please enter an event name');
  if(!f('client').value.trim()) fail('client','Please enter the client name');
  if(!f('date').value) fail('date','Please pick a date');
  if(num('collected') > num('budget') && num('budget') > 0) fail('collected','Collected cannot be more than the budget');
  if(num('confirmed') > num('invited')) fail('confirmed','Confirmed cannot be more than invited');
  if(errs.length){ f(errs[0]).focus(); return; }

  const data = {
    name:f('name').value.trim(), type:form.type.value, client:f('client').value.trim(), venue:f('venue').value.trim(),
    date:f('date').value, time:f('time').value, status:f('status').value,
    budget:num('budget'), collected:num('collected'), invited:Math.round(num('invited')), confirmed:Math.round(num('confirmed')), notes:f('notes').value.trim()
  };
  const events = getEvents();
  if(existing){
    Object.assign(events.find(x=>x.id===existing.id), data);
    ensureClient(data.client);
    saveEvents(events); closeModal(); toast('Event updated'); refresh();
  } else {
    const ev = {id:uid('e'), createdAt:iso(TODAY), ...data};
    events.push(ev); saveEvents(events);
    if(ev.collected > 0) store.set('payments', [...store.get('payments',[]), {id:uid('py'), eventId:ev.id, invoiceId:'', date:iso(TODAY), amount:ev.collected, method:'Cash', reference:'', note:'Recorded when the event was created'}]);
    const res = (form.elements.useTpl && form.elements.useTpl.checked) ? applyTemplate(ev, form.elements.tplId && form.elements.tplId.value) : {tasks:0, timeline:0};
    const added = res.tasks;
    ensureClient(ev.client);
    if(pendingOnCreate){ try{ pendingOnCreate(ev); }catch(err){} pendingOnCreate = null; }
    closeModal();
    toast(`Event created${added ? ` with ${added} tasks${res.timeline ? ` and ${res.timeline} timeline items` : ''}` : ''}`);
    go('event:'+ev.id);
  }
}

function applyTemplate(ev, tplId){
  const all = getTemplates();
  const tpl = all.find(x=>x.id===tplId) || all.find(x=>x.id==='bi-'+ev.type) || all.find(x=>x.id==='bi-Other');
  const out = {tasks:0, timeline:0};
  if(!tpl) return out;
  const lead = daysUntil(ev.date);
  if(lead >= 0 && tpl.tasks.length){
    const maxOff = Math.max(...tpl.tasks.map(t => +t.days||0));
    const scale = maxOff > lead ? Math.max(0, lead-1) / maxOff : 1;   // squeeze the plan if the event is soon
    const tasks = getTasks();
    tpl.tasks.forEach(t => { const d = parse(ev.date); d.setDate(d.getDate() - Math.round((+t.days||0)*scale)); tasks.push({id:uid('t'), eventId:ev.id, title:t.title, due: d < TODAY ? iso(TODAY) : iso(d), done:false, priority:t.priority||'Medium', assignee:''}); out.tasks++; });
    saveTasks(tasks);
  }
  if(tpl.timeline.length){
    const tl = store.get('timeline',[]); const have = tl.filter(x=>x.eventId===ev.id).map(x=>x.title.toLowerCase());
    const start = toMin(ev.time || '18:00');
    tpl.timeline.forEach(x => { if(have.includes(x.title.toLowerCase())) return; tl.push({id:uid('tl'), eventId:ev.id, time:fromMin(start + (+x.off||0)), duration:+x.dur||0, title:x.title, category:x.cat||'Guests', location:'', owner:'', notes:'', done:false}); out.timeline++; });
    store.set('timeline', tl);
  }
  return out;
}
function createTemplateTasks(ev, tplId){ return applyTemplate(ev, tplId).tasks; }
function ensureClient(name){
  name = (name||'').trim(); if(!name) return;
  const cl = store.get('clients', []);
  if(!cl.some(c => c.name.toLowerCase()===name.toLowerCase())){ cl.push({id:uid('c'), name, company:'', email:'', phone:'', city:'', notes:'', createdAt:iso(TODAY)}); store.set('clients', cl); }
}

function deleteEvent(id){
  const e = findEvent(id); if(!e) return;
  const tCount = getTasks().filter(t=>t.eventId===id).length;
  openModal(`
  <div class="modal-card sm">
    <div class="m-body" style="padding-top:26px">
      <div class="confirm-ico t-red">${ic('trash')}</div>
      <h3 class="serif" style="font-size:21px;margin-bottom:6px">Delete “${esc(e.name)}”?</h3>
      <p style="color:var(--muted);font-size:13.5px">This removes the event${tCount ? ` and its ${tCount} task${tCount>1?'s':''}` : ''}. You can undo right after.</p>
    </div>
    <div class="m-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" id="confirmDel">${ic('trash')}Delete event</button></div>
  </div>`);
  document.getElementById('confirmDel').onclick = () => {
    const allE = getEvents(), allT = getTasks();
    const idx = allE.findIndex(x=>x.id===id), removed = allE[idx], removedTasks = allT.filter(t=>t.eventId===id);
    allE.splice(idx,1); saveEvents(allE); saveTasks(allT.filter(t=>t.eventId!==id));
    const related = {}; ['guests','tables','timeline','bookings','menu','menuCfg','styling','decor','talent','rentals','allocations','travel','budgetLines','budgetPlan','invoices','payments','payouts','ticketTypes','promoCodes','ticketSales','campaigns','sponsorPkgs','sponsors','messages','assignments','meetings','docs','risks','permits','safety','emergency','wrapups'].forEach(k => { const all = store.get(k,[]); related[k] = all.filter(x=>x.eventId===id); store.set(k, all.filter(x=>x.eventId!==id)); });
    closeModal();
    if(current==='event:'+id) go('events'); else refresh();
    toast(`“${esc(removed.name)}” deleted`, {label:'Undo', fn:() => {
      const ev2 = getEvents(); ev2.splice(Math.min(idx, ev2.length), 0, removed); saveEvents(ev2);
      saveTasks([...getTasks(), ...removedTasks]); Object.keys(related).forEach(k => store.set(k, [...store.get(k,[]), ...related[k]])); toast('Event restored'); refresh();
    }});
  };
}
function duplicateEvent(id){
  const e = findEvent(id); if(!e) return;
  const copy = {...e, id:uid('e'), name:e.name+' (copy)', status:'Planning', collected:0, confirmed:0, createdAt:iso(TODAY)};
  saveEvents([...getEvents(), copy]);
  saveTasks([...getTasks(), ...getTasks().filter(t=>t.eventId===id).map(t=>({...t, id:uid('t'), eventId:copy.id, done:false}))]);
  ['timeline','tables'].forEach(k => store.set(k, [...store.get(k,[]), ...store.get(k,[]).filter(x=>x.eventId===id).map(x=>({...x, id:uid(k[0]), eventId:copy.id, done:false}))]));
  toast('Event duplicated. You are now viewing the copy.');
  go('event:'+copy.id);
}

const avColor = n => { const cols = ['#e2557f','#7a3d93','#0f9f78','#d9891c','#2f80d8','#c93a66','#5b2a6e','#0b7a5d']; let h=0; for(const ch of n) h = (h*31 + ch.charCodeAt(0))>>>0; return cols[h % cols.length]; };

let calView = 'month', calAnchor = new Date(TODAY), calSel = iso(TODAY), calTasks = true, calLeads = true;
function itemsOn(dateStr, events, tasks, leads){
  const evMap = Object.fromEntries(events.map(e=>[e.id,e]));
  return {
    ev: events.filter(e=>e.date===dateStr).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),
    tk: calTasks ? tasks.filter(t=>t.due===dateStr && evMap[t.eventId]) : [],
    ld: calLeads ? leads.filter(l=>l.followUp===dateStr && !['Won','Lost'].includes(l.stage)) : [],
    evMap
  };
}
function renderCalendarPage(){
  const events = getEvents(), tasks = getTasks(), leads = store.get('leads', []);
  const a = calAnchor;

  if(calView==='month'){
    title = a.toLocaleDateString('en-GB',{month:'long', year:'numeric'});
    const first = new Date(a.getFullYear(), a.getMonth(), 1);
    const start = new Date(first); start.setDate(1 - ((first.getDay()+6)%7));
    let cells = '';
    for(let i=0;i<42;i++){
      const d = new Date(start); d.setDate(start.getDate()+i);
      const k = iso(d), it = itemsOn(k, events, tasks, leads);
      const chips = [

        ...it.ld.map(l => `<span class="chipl" title="Follow up: ${esc(l.name)}">☎ ${esc(l.name)}</span>`)

      cells += `<div class="mcell ${d.getMonth()!==a.getMonth()?'out':''} ${k===iso(TODAY)?'today':''} ${k===calSel?'sel':''} ${chips.length?'has':''}" data-cday="${k}"><span class="dnum">${d.getDate()}</span>${shown.join('')}${extra>0?`<span class="more">+${extra} more</span>`:''}</div>`;

    let cols = '';
    for(let i=0;i<7;i++){
      const d = new Date(ws); d.setDate(ws.getDate()+i); const k = iso(d), it = itemsOn(k, events, tasks, leads);
      cols += `<div class="wcol ${k===iso(TODAY)?'today':''} ${k===calSel?'sel':''}" data-cday="${k}">

        ${it.ev.map(e=>`<div class="wev" style="--tc:${tColor(e.type)}" data-open="${e.id}"><b>${esc(e.name)}</b><span>${e.time?fmtTime(e.time)+' · ':''}${esc(e.venue||e.client)}</span></div>`).join('')}
        ${it.tk.map(t=>`<span class="chipt ${t.done?'done':''} ${!t.done && daysUntil(t.due)<0?'od':''}"><i></i>${esc(t.title)}</span>`).join('')}
        ${it.ld.map(l=>`<span class="chipl">☎ ${esc(l.name)}</span>`).join('')}
      </div>`;
    }
    body = `<div class="wgrid">${cols}</div>`;
  }
  const monthEv = events.filter(e => { const d = parse(e.date); return d.getMonth()===a.getMonth() && d.getFullYear()===a.getFullYear() && e.status!=='Cancelled'; });
  document.getElementById('content').innerHTML = `

    <div class="page-head">

    </div>

      <div class="panel">
        <div class="cal-bar">
          <div class="cal-nav"><button id="cPrev" aria-label="Previous">${ic('chevL')}</button><button id="cNext" aria-label="Next">${ic('chevR')}</button></div>

          <label class="chk"><input type="checkbox" id="cLeads" ${calLeads?'checked':''}>Follow-ups</label>

function renderAgenda(events, tasks, leads, monthCount){
  const it = itemsOn(calSel, events, tasks, leads), d = parse(calSel), dd = daysUntil(calSel);
  const rel = dd===0 ? 'Today' : dd===1 ? 'Tomorrow' : dd===-1 ? 'Yesterday' : dd>0 ? `In ${dd} days` : `${-dd} days ago`;
  const empty = !it.ev.length && !it.tk.length && !it.ld.length;
  document.getElementById('agenda').innerHTML = `
    <h4>${d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'})}</h4>
    <div class="sub">${rel} · ${monthCount} event${monthCount!==1?'s':''} this month</div>
    ${it.ev.length ? `<div class="ag-sec">Events</div>${it.ev.map(e=>`<div class="ag-item" style="--tc:${tColor(e.type)}" data-open="${e.id}"><span class="bar"></span><div><b>${esc(e.name)}</b><span>${e.time?fmtTime(e.time)+' · ':''}${esc(e.venue||'No venue')} · ${e.status}</span></div></div>`).join('')}` : ''}

    ${it.ld.length ? `<div class="ag-sec">Lead follow-ups</div>${it.ld.map(l=>`<div class="ag-item" style="--tc:var(--amber)" data-lead-open="${l.id}"><span class="bar"></span><div><b>${esc(l.name)}</b><span>${l.stage} · ${l.eventType} · ${esc(l.phone||'')}</span></div></div>`).join('')}` : ''}
    ${empty ? `<div class="empty" style="padding:26px 6px">Nothing scheduled for this day.</div>` : ''}
    ${dd>=0 ? `<button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:10px" id="agNew">${ic('plus')}Add event on this day</button>` : ''}`;
  const b = document.getElementById('agNew'); if(b) b.onclick = () => openEventForm(null, {date:calSel});
}

let clQuery = '', clSort = 'value';
function clientStats(c, events){
  const evs = events.filter(e => e.client.toLowerCase()===c.name.toLowerCase());
  const valid = evs.filter(e=>e.status!=='Cancelled');
  const value = valid.reduce((s,e)=>s+e.budget,0), paid = valid.reduce((s,e)=>s+e.collected,0);
  const next = evs.filter(e=>daysUntil(e.date)>=0 && e.status!=='Cancelled').sort((a,b)=>a.date.localeCompare(b.date))[0];
  const last = evs.filter(e=>daysUntil(e.date)<0).sort((a,b)=>b.date.localeCompare(a.date))[0];
  return {evs, value, paid, due:value-paid, next, last};
}

const STAGES = ['New','Contacted','Proposal Sent','Negotiation','Won','Lost'];
const STAGE_CLS = {'New':'t-sky','Contacted':'t-plum','Proposal Sent':'t-amber','Negotiation':'t-rose','Won':'t-emerald','Lost':'t-grey'};
const SOURCES = ['Instagram','Facebook','Website','Referral','Phone','Walk-in','LinkedIn','Other'];
let ldQuery = '';
function fuChip(l){
  if(!l.followUp || ['Won','Lost'].includes(l.stage)) return '';
  const d = daysUntil(l.followUp);
  return `<span class="fu ${d<0?'t-red':d===0?'t-amber':'t-grey'}">☎ ${d<0?`${-d}d overdue`:d===0?'Today':d===1?'Tomorrow':fmtDate(l.followUp)}</span>`;
}
function renderLeads(){
  const leads = store.get('leads', []);
  const open = leads.filter(l=>!['Won','Lost'].includes(l.stage));
  const won = leads.filter(l=>l.stage==='Won').length, lost = leads.filter(l=>l.stage==='Lost').length;
  const dueFu = open.filter(l=>l.followUp && daysUntil(l.followUp)<=0).length;
  document.getElementById('content').innerHTML = `
  <div class="fade">
    <div class="page-head">
      <div><h2 class="serif">Leads & Pipeline</h2><p>Track every enquiry from first message to booked event</p></div>
      <div class="ph-actions"><button class="btn btn-primary" id="ldNew">${ic('plus')}New lead</button></div>
    </div>
    <div class="stat-strip">
      <div class="ss"><span class="chip t-sky">${ic('leads')}</span><div><small>Open leads</small><b>${open.length}</b></div></div>
      <div class="ss"><span class="chip t-plum">${ic('trend')}</span><div><small>Pipeline value</small><b>${moneyShort(open.reduce((s,l)=>s+(+l.budget||0),0))}</b></div></div>
      <div class="ss"><span class="chip t-emerald">${ic('target')}</span><div><small>Win rate</small><b>${won+lost ? Math.round(won/(won+lost)*100) : 0}%</b></div></div>
      <div class="ss"><span class="chip ${dueFu?'t-red':'t-grey'}">${ic('phone')}</span><div><small>Follow-ups due</small><b>${dueFu}</b></div></div>
    </div>
    <div class="panel toolbar">
      <div class="board-hint" style="margin:0">${ic('kanban')}Drag cards between stages · click a card to open it</div>
      <label class="tsearch">${ic('search')}<input id="ldQ" placeholder="Search leads…" value="${esc(ldQuery)}"></label>
    </div>
    <div id="ldBoard"></div>
  </div>`;
  const draw = () => {
    const q = ldQuery.trim().toLowerCase();
    const list = leads.filter(l => !q || [l.name,l.company,l.eventType,l.source,l.phone,l.email].join(' ').toLowerCase().includes(q));
    document.getElementById('ldBoard').innerHTML = `<div class="board leads">${STAGES.map(st => {
      const items = list.filter(l=>l.stage===st).sort((a,b)=>(a.followUp||'9').localeCompare(b.followUp||'9'));
      return `<div class="k-col" data-status="${st}" data-kind="lead">
        <div class="k-head"><span class="pill ${STAGE_CLS[st]}"><i></i>${st}</span><b>${items.length}</b><span class="k-sum">${moneyShort(items.reduce((s,l)=>s+(+l.budget||0),0))}</span></div>
        <div class="k-list">${items.map(l=>`
          <div class="k-card" draggable="true" data-id="${l.id}" data-lead-open="${l.id}" style="--tc:${tColor(l.eventType)}">
            <span class="type-tag" style="margin:0"><i style="background:${tColor(l.eventType)}"></i>${esc(l.eventType)}${l.guests?` · ${l.guests} guests`:''}</span>
            <b>${esc(l.name)}</b>
            <span>${l.company ? esc(l.company)+' · ' : ''}${l.eventDate ? fmtDate(l.eventDate) : 'Date TBC'}</span>
            <div class="lc-row"><span class="src">${esc(l.source)}</span>${fuChip(l)}</div>
            <div class="lc-meta"><span style="color:var(--muted)">Budget</span><b>${l.budget ? moneyShort(+l.budget) : '—'}</b></div>
          </div>`).join('') || '<div class="k-empty">Drop leads here</div>'}</div>
      </div>`; }).join('')}</div>`;
  };
  draw();
  document.getElementById('ldQ').addEventListener('input', e => { ldQuery = e.target.value; draw(); });
  document.getElementById('ldNew').onclick = () => openLeadForm();
}
function setLeadStage(id, stage){
  const all = store.get('leads',[]), l = all.find(x=>x.id===id); if(!l || l.stage===stage) return;
  l.stage = stage; store.set('leads', all);
  toast(`${esc(l.name)} moved to ${stage}`);
  refresh();
  if(stage==='Won' && !l.eventId) setTimeout(()=> toast('Lead won! Create the event?', {label:'Create event', fn:()=>convertLead(id)}), 300);
}
function openLeadForm(id){
  const l = id ? store.get('leads',[]).find(x=>x.id===id) : null;
  const v = l || {name:'',company:'',phone:'',email:'',eventType:'Wedding',eventDate:'',guests:'',budget:'',source:'Instagram',stage:'New',followUp:addDays(1),notes:''};
  const fld = (label, name, val, type='text', extra='', full=false) => `<div class="field ${full?'full':''}"><label for="l_${name}">${label}</label><input id="l_${name}" name="${name}" type="${type}" value="${esc(val??'')}" ${extra}><small class="err"></small></div>`;
  const sel = (label, name, opts, val) => `<div class="field"><label for="l_${name}">${label}</label><select id="l_${name}" name="${name}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;
  openModal(`
  <form class="modal-card" id="ldForm" novalidate>
    <div class="m-head"><div><h3 class="serif">${l ? esc(l.name) : 'New lead'}</h3><p>${l ? `Added ${fmtDate(l.createdAt)} · ${l.source}${l.eventId ? ' · converted to event' : ''}` : 'Capture an enquiry so it never slips through.'}</p></div><button type="button" class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="m-body"><div class="form-grid">
      ${fld('Contact name *','name',v.name,'text','maxlength="60"')}
      ${fld('Company','company',v.company,'text','maxlength="60" placeholder="Optional"')}
      ${fld('Phone','phone',v.phone,'tel','maxlength="25"')}
      ${fld('Email','email',v.email,'email','maxlength="80"')}
      ${sel('Event type','eventType',TYPES,v.eventType)}
      ${fld('Preferred date','eventDate',v.eventDate,'date')}
      ${fld('Expected guests','guests',v.guests,'number','min="0"')}
      ${fld(`Budget (${CUR})`,'budget',v.budget,'number','min="0" step="1000"')}
      ${sel('Source','source',SOURCES,v.source)}
      ${sel('Stage','stage',STAGES,v.stage)}
      ${fld('Next follow-up','followUp',v.followUp,'date')}
      <div class="field"></div>
      <div class="field full"><label for="l_notes">Notes</label><textarea id="l_notes" name="notes" maxlength="800" placeholder="What did they ask for?">${esc(v.notes||'')}</textarea></div>
    </div></div>
    <div class="m-foot">
      ${l ? `<div class="m-actions-left">
        <button type="button" class="btn btn-ghost" style="color:var(--red)" id="lDel" title="Delete lead">${ic('trash')}</button>
        ${!l.eventId ? `<button type="button" class="btn btn-ghost" id="lProp">${ic('proposal')}Create proposal</button><button type="button" class="btn btn-ghost" id="lConv" style="color:var(--emerald)">${ic('arrowR')}Convert to event</button>` : `<button type="button" class="btn btn-ghost" data-open="${l.eventId}">${ic('eye')}View event</button>`}
      </div>` : ''}
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit">${ic('checkSm')}${l?'Save':'Add lead'}</button>
    </div>
  </form>`);
  const form = document.getElementById('ldForm'); if(!l) setTimeout(()=>form.elements.name.focus(),50);
  const collect = () => { const g = n => form.elements[n].value.trim(); return {name:g('name'), company:g('company'), phone:g('phone'), email:g('email'), eventType:g('eventType'), eventDate:g('eventDate'), guests:Math.max(0,+g('guests')||0), budget:Math.max(0,+g('budget')||0), source:g('source'), stage:g('stage'), followUp:g('followUp'), notes:g('notes')}; };
  const validate = () => {
    form.querySelectorAll('.field').forEach(x=>{x.classList.remove('invalid'); const er=x.querySelector('.err'); if(er) er.textContent='';});
    const fail = (n,m) => { const b = form.elements[n].closest('.field'); b.classList.add('invalid'); b.querySelector('.err').textContent = m; form.elements[n].focus(); return false; };
    if(!form.elements.name.value.trim()) return fail('name','Please enter a contact name');
    if(!isEmail(form.elements.email.value.trim())) return fail('email','Please enter a valid email');
    return true;
  };
  const persist = () => { const all = store.get('leads',[]); const data = collect(); if(l){ Object.assign(all.find(x=>x.id===l.id), data); } else all.push({id:uid('l'), createdAt:iso(TODAY), ...data}); store.set('leads', all); };
  form.addEventListener('submit', ev => { ev.preventDefault(); if(!validate()) return; persist(); closeModal(); toast(l?'Lead saved':'Lead added'); refresh(); });
  if(l){
    document.getElementById('lDel').onclick = () => { const all = store.get('leads',[]); const idx = all.findIndex(x=>x.id===l.id); const [rm] = all.splice(idx,1); store.set('leads', all); closeModal(); refresh(); toast(`Lead “${esc(rm.name)}” deleted`, {label:'Undo', fn:()=>{ const a2=store.get('leads',[]); a2.splice(idx,0,rm); store.set('leads',a2); refresh(); }}); };
    const conv = document.getElementById('lConv'); if(conv) conv.onclick = () => { if(!validate()) return; persist(); convertLead(l.id); };
    const prop = document.getElementById('lProp'); if(prop) prop.onclick = () => { if(!validate()) return; persist(); const x = store.get('leads',[]).find(y=>y.id===l.id); openProposalForm(null, {client:x.company||x.name, title:`${x.company||x.name} ${x.eventType}`, eventType:x.eventType, eventDate:x.eventDate||addDays(30), leadId:x.id, items: x.guests ? [{desc:'Catering (per head)', qty:x.guests, price:1500}] : []}); };
  }
}
function convertLead(id){
  const l = store.get('leads',[]).find(x=>x.id===id); if(!l) return;
  closeModal();
  openEventForm(null, {name:`${l.company || l.name} ${l.eventType}`, type:l.eventType, client:l.company || l.name, date:l.eventDate && daysUntil(l.eventDate)>=0 ? l.eventDate : addDays(30), budget:l.budget||'', invited:l.guests||'', status:'Confirmed', notes:l.notes||''}, ev => {
    const all = store.get('leads',[]); const x = all.find(y=>y.id===id); if(x){ x.stage='Won'; x.eventId = ev.id; store.set('leads', all); }
    const cl = store.get('clients',[]); const c = cl.find(y=>y.name===ev.client); if(c && !c.phone){ c.phone = l.phone; c.email = l.email; c.company = l.company; store.set('clients', cl); }
  });
}

const PROP_STATUS = {Draft:'t-grey', Sent:'t-amber', Accepted:'t-emerald', Declined:'t-red'};
const QUICK_ITEMS = [['Venue hire',1,300000],['Catering (per head)',100,1500],['Décor package',1,150000],['Photography & video',1,120000],['DJ & sound system',1,60000],['Lighting',1,50000],['Invitation cards (each)',100,150],['Planning & coordination fee',1,50000]];
let prStatus = 'All';
function quoteTotals(p){
  const sub = (p.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0);
  const disc = sub * (+p.discount||0)/100, taxed = (sub-disc) * (+p.tax||0)/100;
  return {sub, disc, tax:taxed, total: Math.round(sub - disc + taxed)};
}
function nextQuoteNo(){ const n = store.get('proposals',[]).map(p=>+String(p.number).replace(/\D/g,'')||1000); return 'Q-' + (Math.max(1000,...n)+1); }

      <div class="ss"><span class="chip t-amber">${ic('send')}</span><div><small>Awaiting reply</small><b>${props.filter(p=>p.status==='Sent').length}</b></div></div>

    </div>
    <div class="panel">
      <div class="p-head"><div><h3>All proposals</h3><p>Click a proposal to preview it</p></div>
        <div class="tabs">${['All','Draft','Sent','Accepted','Declined'].map(t=>`<button class="${t===prStatus?'on':''}" data-prtab="${t}">${t}<span>${t==='All'?props.length:props.filter(p=>p.status===t).length}</span></button>`).join('')}</div></div>
      <div class="tbl-wrap">${(() => {

        ${rows.map(p => { const exp = p.status==='Sent' && p.validUntil && daysUntil(p.validUntil)<0; return `<tr>
          <td><button class="ev-link" data-prop-open="${p.id}">${p.number}</button><span class="type-tag">Created ${fmtDate(p.createdAt)}</span></td>
          <td>${esc(p.client)}</td>
          <td><b style="font-weight:600">${esc(p.title)}</b><span class="type-tag" style="display:flex"><i style="background:${tColor(p.eventType)}"></i>${esc(p.eventType)}</span></td>
          <td style="white-space:nowrap">${p.eventDate ? fmtDate(p.eventDate) : '—'}</td>

          <td style="white-space:nowrap;${exp?'color:var(--red);font-weight:600':''}">${p.validUntil ? fmtDate(p.validUntil) : '—'}${exp?'<div style="font-size:11px">Expired</div>':''}</td>

function syncGuestCounts(eventId){
  const gs = store.get('guests',[]).filter(g=>g.eventId===eventId); if(!gs.length) return;
  const events = getEvents(), e = events.find(x=>x.id===eventId); if(!e) return;
  e.invited = gs.filter(g=>g.rsvp!=='Declined').reduce((s,g)=>s+1+(+g.plusOnes||0),0) + gs.filter(g=>g.rsvp==='Declined').reduce((s,g)=>s+1+(+g.plusOnes||0),0);
  e.confirmed = gs.filter(g=>g.rsvp==='Confirmed').reduce((s,g)=>s+1+(+g.plusOnes||0),0);
  saveEvents(events);
}
function defaultPick(){
  const events = getEvents().filter(e=>e.status!=='Cancelled');

  if(saved && events.some(e=>e.id===saved)) return saved;
  const up = events.filter(e=>daysUntil(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
  return (up[0] || events[0] || {}).id || '';
}

    const st = toMin(x.time), en = st + (+x.duration||0);

    if(prevEnd!=null && st < prevEnd) warn = `<div class="tl-warn" style="color:var(--amber)">${ic('alert')}Overlaps the previous item by ${durTxt(prevEnd-st)}</div>`;
    else if(prevEnd!=null && st - prevEnd >= 30) warn = `<div class="tl-gap">· · · ${durTxt(st-prevEnd)} free · · ·</div>`;
    prevEnd = Math.max(prevEnd||0, en);
    const c = TL_CATS[x.category] || '#8a8590';
    rows += `${warn ? `<div class="tl-row"><div></div><div class="tl-axis"></div>${warn}</div>` : ''}
    <div class="tl-row ${x.done?'done':''} ${nowItem===x?'now':''}" style="--tc:${c}">
      <div class="tl-time"><b>${fmtTime(x.time)}</b><span>to ${fmtTime(fromMin(en))}</span></div>

          <div class="tl-sub">${x.location?`<span>${ic('pin')}${esc(x.location)}</span>`:''}${x.owner?`<span>${ic('staff')}${esc(x.owner)}</span>`:''}<span>${ic('clock')}${durTxt(+x.duration||0)}</span></div>
          ${x.notes?`<div style="font-size:12px;margin-top:5px">${esc(x.notes)}</div>`:''}</div>
        <span class="tl-cat">${esc(x.category)}</span>
        <div class="acts"><button title="Edit" data-tl-edit="${x.id}">${ic('edit')}</button><button title="Delete" class="del" data-tl-del="${x.id}">${ic('trash')}</button></div>
      </div>
    </div>`;
  });
  const first = items[0], last = items[items.length-1];
  el.innerHTML = `
    ${isToday && items.length ? `<div class="now-banner">${ic('activity')}<span><b>Live today.</b> ${nowItem ? `Now: <b>${esc(nowItem.title)}</b>` : nowMin < toMin(first.time) ? `Starts at ${fmtTime(first.time)}` : 'Programme finished'} · ${doneN}/${items.length} done</span></div>` : ''}
    <div class="panel">
      <div class="p-head">
        <div><h3>Run of show</h3><p>${items.length ? `${items.length} items · ${fmtTime(first.time)} – ${fmtTime(fromMin(Math.max(...items.map(x=>toMin(x.time)+(+x.duration||0)))))} · ${doneN} done` : 'No items yet'}</p></div>
        <div class="tbl-tools">
          ${items.length ? `<button class="btn btn-ghost" style="height:38px" data-tl-copy="${eventId}">${ic('copy')}Copy</button>` : ''}
          <button class="btn btn-ghost" style="height:38px" data-tl-tpl="${eventId}">${ic('wand')}${items.length?'Add template items':'Use ' + e.type.toLowerCase() + ' template'}</button>
          <button class="btn btn-primary" style="height:38px" data-tl-new="${eventId}">${ic('plus')}Add item</button>
        </div>
      </div>
      ${items.length ? `<div class="tl">${rows}</div>` : `<div class="empty">${ic('timeline')}<p style="margin-top:8px">Build the event-day schedule from scratch, or start from the ${e.type.toLowerCase()} template (based on the start time ${e.time ? fmtTime(e.time) : '6:00 PM'}).</p></div>`}
      <div class="legend-row">${Object.entries(TL_CATS).map(([k,c])=>`<span><i style="background:${c}"></i>${k}</span>`).join('')}</div>

}
function openTimelineForm(eventId, id){

  const last = store.get('timeline',[]).filter(y=>y.eventId===eventId).sort((a,b)=>toMin(b.time)+(+b.duration)-toMin(a.time)-(+a.duration))[0];

      <div class="field full"><label for="t_own">Responsible person / vendor</label><input id="t_own" name="owner" value="${esc(v.owner)}" maxlength="60" placeholder="e.g. DJ, Caterer, Hosts"></div>
      <div class="field full"><label for="t_notes">Notes</label><textarea id="t_notes" name="notes" maxlength="400">${esc(v.notes||'')}</textarea></div>

  </form>`);
  const f = document.getElementById('tlForm'); setTimeout(()=>f.elements.title.focus(),50);
  f.addEventListener('submit', ev => {
    ev.preventDefault();
    f.querySelectorAll('.field').forEach(b=>{b.classList.remove('invalid'); const er=b.querySelector('.err'); if(er) er.textContent='';});
    const fail = (n,m) => { const b = f.elements[n].closest('.field'); b.classList.add('invalid'); b.querySelector('.err').textContent = m; f.elements[n].focus(); };
    if(!f.elements.title.value.trim()) return fail('title','Please describe this item');
    if(!f.elements.time.value) return fail('time','Please set a start time');
    const data = {time:f.elements.time.value, duration:Math.max(0,Math.round(+f.elements.duration.value||0)), title:f.elements.title.value.trim(), category:f.elements.category.value, location:f.elements.location.value.trim(), owner:f.elements.owner.value.trim(), notes:f.elements.notes.value.trim()};
    const all = store.get('timeline',[]);
    if(x) Object.assign(all.find(y=>y.id===x.id), data); else all.push({id:uid('tl'), eventId, done:false, ...data});
    store.set('timeline', all); closeModal(); toast(x?'Item updated':'Item added'); refresh();
  });
}
function applyTimelineTemplate(eventId){
  const e = findEvent(eventId); const start = toMin(e.time || '18:00');
  const all = store.get('timeline',[]); const existing = all.filter(x=>x.eventId===eventId).map(x=>x.title.toLowerCase());
  let n = 0;
  (TL_TEMPLATES[e.type] || TL_TEMPLATES.Other).forEach(([off, dur, title, cat]) => { if(existing.includes(title.toLowerCase())) return; all.push({id:uid('tl'), eventId, time:fromMin(start+off), duration:dur, title, category:cat, location:'', owner:'', notes:'', done:false}); n++; });
  store.set('timeline', all);
  toast(n ? `${n} items added from the ${e.type.toLowerCase()} template` : 'Template items are already in the timeline');
  refresh();
}
function copyTimeline(eventId){
  const e = findEvent(eventId);
  const items = store.get('timeline',[]).filter(x=>x.eventId===eventId).sort((a,b)=>toMin(a.time)-toMin(b.time));
  const txt = [`RUN OF SHOW — ${e.name}`, `${fmtDate(e.date)}${e.venue ? ' · '+e.venue : ''}`, '', ...items.map(x=>`${fmtTime(x.time)} – ${fmtTime(fromMin(toMin(x.time)+(+x.duration||0)))}  ${x.title}${x.location?' @ '+x.location:''}${x.owner?' ('+x.owner+')':''}`)].join('\n');
  try{ navigator.clipboard.writeText(txt).then(()=>toast('Timeline copied. Share it with your crew.'), ()=>toast('Copy was blocked by the browser')); }catch(err){ toast('Copy was blocked by the browser'); }
}

const DIET_OPTS = ['None','Vegetarian','Vegan','Halal only','Gluten-free','Nut allergy','Diabetic'];
let gQuery = '', gRsvp = 'All', gGroup = 'All', gLimit = 60;
function renderGuestsPage(){ pickPage('Guests & RSVP','Guest lists, RSVPs, plus-ones and dietary needs for each event', (el, id) => guestManager(el, id, false)); }
function guestManager(el, eventId, embedded){
  const all = store.get('guests',[]).filter(g=>g.eventId===eventId);
  const tables = Object.fromEntries(store.get('tables',[]).filter(t=>t.eventId===eventId).map(t=>[t.id,t.name]));
  const head = arr => arr.reduce((s,g)=>s+1+(+g.plusOnes||0),0);
  const by = r => all.filter(g=>g.rsvp===r);
  const diets = {}; all.filter(g=>g.rsvp!=='Declined' && g.diet && g.diet!=='None').forEach(g => diets[g.diet] = (diets[g.diet]||0) + 1);
  const groupsUsed = [...new Set(all.map(g=>g.group))];
  const q = gQuery.trim().toLowerCase();
  const rows = all.filter(g => (gRsvp==='All'||g.rsvp===gRsvp) && (gGroup==='All'||g.group===gGroup) && (!q || [g.name,g.phone,g.email,g.group,g.diet].join(' ').toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name));
  el.innerHTML = `
    <div class="stat-strip">
      <div class="ss"><span class="chip t-plum">${ic('guests')}</span><div><small>Invited (people)</small><b>${head(all)}</b></div></div>
      <div class="ss"><span class="chip t-emerald">${ic('check')}</span><div><small>Confirmed</small><b>${head(by('Confirmed'))}</b></div></div>
      <div class="ss"><span class="chip t-amber">${ic('clock')}</span><div><small>Awaiting reply</small><b>${head(by('Pending'))+head(by('Maybe'))}</b></div></div>
      <div class="ss"><span class="chip t-red">${ic('xc')}</span><div><small>Declined</small><b>${head(by('Declined'))}</b></div></div>
    </div>
    ${Object.keys(diets).length ? `<div class="diet-row"><span style="background:none;border:0;padding-left:0;color:var(--muted)">${ic('utensils').replace('class="i"','class="i" style="width:14px;height:14px;vertical-align:-2px"')} Dietary needs:</span>${Object.entries(diets).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span>${esc(k)}<b>${n}</b></span>`).join('')}</div>` : ''}
    <div class="panel">
      <div class="p-head">
        <div><h3>Guest list</h3><p>${all.length} invitations · ${rows.length} shown</p></div>
        <div class="tbl-tools">
          ${all.length ? `<button class="btn btn-ghost" style="height:38px" data-g-remind="${eventId}" title="Copy a reminder for guests who haven't replied">${ic('send')}RSVP reminder</button><button class="btn btn-ghost" style="height:38px" data-g-csv="${eventId}">${ic('copy')}CSV</button>` : ''}
          <button class="btn btn-ghost" style="height:38px" data-g-bulk="${eventId}">${ic('upload')}Bulk add</button>
          <button class="btn btn-primary" style="height:38px" data-g-new="${eventId}">${ic('plus')}Add guest</button>
        </div>
      </div>
      ${all.length ? `<div class="toolbar" style="padding:0;margin-bottom:14px">
        <div class="tabs">${['All','Confirmed','Pending','Maybe','Declined'].map(t=>`<button class="${t===gRsvp?'on':''}" data-g-tab="${t}">${t}<span>${t==='All'?all.length:by(t).length}</span></button>`).join('')}</div>
        <div class="tb-right"><select class="sel" id="gGroup"><option value="All">All groups</option>${groupsUsed.map(x=>`<option ${x===gGroup?'selected':''}>${esc(x)}</option>`).join('')}</select>
        <label class="tsearch">${ic('search')}<input id="gQ" placeholder="Search guests…" value="${esc(gQuery)}"></label></div>
      </div>
      <div class="tbl-wrap"><table style="min-width:820px"><thead><tr><th>Guest</th><th>Phone</th><th>RSVP</th><th>Party</th><th>Diet</th><th>Table</th><th style="text-align:right;padding-right:20px">Actions</th></tr></thead><tbody>
      ${rows.slice(0,gLimit).map(g=>`<tr>
        <td><div class="who"><span class="av" style="width:32px;height:32px;font-size:11px;background:${avColor(g.name)}">${initials(g.name)}</span><div><b>${esc(g.name)}</b><span>${esc(g.group)}</span></div></div></td>
        <td style="color:var(--muted)">${esc(g.phone||'—')}</td>
        <td><select class="rsvp-sel ${RSVP[g.rsvp]}" data-g-rsvp="${g.id}" aria-label="RSVP">${Object.keys(RSVP).map(r=>`<option ${r===g.rsvp?'selected':''}>${r}</option>`).join('')}</select></td>
        <td>${+g.plusOnes ? `<span class="party">1 + ${g.plusOnes}</span>` : '<span style="color:var(--muted)">1</span>'}</td>
        <td>${g.diet && g.diet!=='None' ? `<span class="tag-sm t-amber">${esc(g.diet)}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
        <td>${g.tableId && tables[g.tableId] ? `<span class="tag-sm t-plum">${esc(tables[g.tableId])}</span>` : '<span style="color:var(--muted)">—</span>'}</td>
        <td style="padding-right:20px"><div class="acts"><button title="Edit" data-g-edit="${g.id}">${ic('edit')}</button><button title="Delete" class="del" data-g-del="${g.id}">${ic('trash')}</button></div></td>
      </tr>`).join('') || `<tr><td colspan="7"><div class="empty">No guests match.</div></td></tr>`}
      </tbody></table></div>
      ${rows.length > gLimit ? `<button class="btn btn-ghost more-btn" data-g-more>Show ${Math.min(60, rows.length-gLimit)} more of ${rows.length-gLimit} remaining</button>` : ''}`
      : `<div class="empty">${ic('guests')}<p style="margin-top:8px">No guests yet. Add them one by one, or paste a whole list with <b>Bulk add</b>.</p></div>`}
      ${!embedded && all.length ? `<div class="seat-hint">${ic('seating')}Arrange confirmed guests at tables in the <a href="#" data-page="seating" style="color:var(--rose);font-weight:600">Seating Plan</a>.</div>` : ''}
    </div>`;
  const gq = el.querySelector('#gQ'); if(gq) gq.addEventListener('input', e => { gQuery = e.target.value; gLimit = 60; guestManager(el, eventId, embedded); const n = el.querySelector('#gQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  const gg = el.querySelector('#gGroup'); if(gg) gg.onchange = e => { gGroup = e.target.value; gLimit = 60; guestManager(el, eventId, embedded); };
  el.querySelectorAll('[data-g-rsvp]').forEach(s => s.onchange = e => { const a = store.get('guests',[]); const g = a.find(x=>x.id===s.dataset.gRsvp); g.rsvp = e.target.value; if(g.rsvp==='Declined') g.tableId=''; store.set('guests', a); syncGuestCounts(eventId); toast(`${esc(g.name)}: ${g.rsvp}`); refresh(); });
}
function openGuestForm(eventId, id){
  const g = id ? store.get('guests',[]).find(x=>x.id===id) : null;
  const v = g || {name:'',phone:'',email:'',group:'Family',rsvp:'Pending',plusOnes:0,diet:'None',notes:''};
  const sel = (label, name, opts, val) => `<div class="field"><label for="g_${name}">${label}</label><select id="g_${name}" name="${name}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select></div>`;
  openModal(`
  <form class="modal-card" id="gForm" novalidate>
    <div class="m-head"><div><h3 class="serif">${g?'Edit guest':'Add guest'}</h3><p>${esc(findEvent(eventId).name)}</p></div><button type="button" class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="m-body"><div class="form-grid">
      <div class="field full"><label for="g_name">Full name *</label><input id="g_name" name="name" value="${esc(v.name)}" maxlength="60"><small class="err"></small></div>
      <div class="field"><label for="g_phone">Phone</label><input id="g_phone" name="phone" type="tel" value="${esc(v.phone)}" maxlength="25"></div>
      <div class="field"><label for="g_email">Email</label><input id="g_email" name="email" type="email" value="${esc(v.email)}" maxlength="80"><small class="err"></small></div>
      ${sel('Group','group',GROUPS,v.group)}
      ${sel('RSVP','rsvp',Object.keys(RSVP),v.rsvp)}
      <div class="field"><label for="g_plus">Plus-ones (extra people)</label><input id="g_plus" name="plusOnes" type="number" min="0" max="20" value="${v.plusOnes}"></div>
      ${sel('Dietary need','diet',DIET_OPTS,v.diet)}
      <div class="field full"><label for="g_notes">Notes</label><textarea id="g_notes" name="notes" maxlength="300" placeholder="e.g. Wheelchair access, needs a ride">${esc(v.notes||'')}</textarea></div>
    </div></div>
    <div class="m-foot"><button type="button" class="btn btn-ghost" data-close>Cancel</button>${!g?'<button type="button" class="btn btn-ghost" id="gAddMore">Save & add another</button>':''}<button class="btn btn-primary" type="submit">${ic('checkSm')}${g?'Save':'Add guest'}</button></div>
  </form>`);
  const f = document.getElementById('gForm'); setTimeout(()=>f.elements.name.focus(),50);
  const save = again => {
    f.querySelectorAll('.field').forEach(b=>{b.classList.remove('invalid'); const er=b.querySelector('.err'); if(er) er.textContent='';});
    const fail = (n,m) => { const b = f.elements[n].closest('.field'); b.classList.add('invalid'); b.querySelector('.err').textContent = m; f.elements[n].focus(); };
    const x = n => f.elements[n].value.trim();
    if(!x('name')) return fail('name','Please enter a name');
    if(!isEmail(x('email'))) return fail('email','Please enter a valid email');
    const data = {name:x('name'), phone:x('phone'), email:x('email'), group:x('group'), rsvp:x('rsvp'), plusOnes:Math.max(0,Math.min(20,Math.round(+x('plusOnes')||0))), diet:x('diet'), notes:x('notes')};
    const all = store.get('guests',[]);
    if(g){ const t = all.find(y=>y.id===g.id); Object.assign(t, data); if(t.rsvp==='Declined') t.tableId=''; }
    else all.push({id:uid('g'), eventId, tableId:'', ...data});
    store.set('guests', all); syncGuestCounts(eventId);
    toast(g ? 'Guest updated' : `${esc(data.name)} added`);
    if(again){ refresh(); openGuestForm(eventId); } else { closeModal(); refresh(); }
  };
  f.addEventListener('submit', ev => { ev.preventDefault(); save(false); });
  const am = document.getElementById('gAddMore'); if(am) am.onclick = () => save(true);
}
function openBulkGuests(eventId){
  openModal(`
  <form class="modal-card" id="bkForm" novalidate>
    <div class="m-head"><div><h3 class="serif">Bulk add guests</h3><p>Paste one guest per line. Add a phone number after a comma if you have it.</p></div><button type="button" class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="m-body">
      <div class="field full"><label for="bk_list">Guest list</label><textarea id="bk_list" name="list" style="height:200px" placeholder="Ali Khan, +92 300 1234567&#10;Sara Ahmed +2&#10;Usman Malik"></textarea><small class="err"></small></div>
      <p style="font-size:12px;color:var(--muted);margin:8px 0 14px">Tip: add <b>+1</b> or <b>+2</b> after a name for plus-ones.</p>
      <div class="form-grid">
        <div class="field"><label for="bk_group">Group for all</label><select id="bk_group" name="group">${GROUPS.map(o=>`<option>${o}</option>`).join('')}</select></div>
        <div class="field"><label for="bk_rsvp">RSVP for all</label><select id="bk_rsvp" name="rsvp">${Object.keys(RSVP).map(o=>`<option ${o==='Pending'?'selected':''}>${o}</option>`).join('')}</select></div>
      </div>
      <div id="bkPrev" style="font-size:12.5px;color:var(--muted);margin-top:12px"></div>
    </div>
    <div class="m-foot"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" type="submit">${ic('upload')}Add guests</button></div>
  </form>`);
  const f = document.getElementById('bkForm'); setTimeout(()=>f.elements.list.focus(),50);
  const parseLines = () => f.elements.list.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l => {
    let plus = 0; const pm = l.match(/\+(\d)\b(?!\d)/); if(pm && !/\+\d{3,}/.test(pm[0])){ plus = +pm[1]; l = l.replace(pm[0],''); }
    const parts = l.split(','); const name = parts[0].replace(/\s+/g,' ').trim(); const phone = (parts[1]||'').trim();
    return {name, phone, plus};
  }).filter(x=>x.name);
  f.elements.list.addEventListener('input', () => { const n = parseLines(); document.getElementById('bkPrev').textContent = n.length ? `${n.length} guest${n.length>1?'s':''} ready · ${n.reduce((s,x)=>s+1+x.plus,0)} people in total` : ''; });
  f.addEventListener('submit', ev => {
    ev.preventDefault(); const list = parseLines();
    if(!list.length){ const b = f.elements.list.closest('.field'); b.classList.add('invalid'); b.querySelector('.err').textContent = 'Paste at least one name'; return; }
    const all = store.get('guests',[]);
    list.forEach(x => all.push({id:uid('g'), eventId, name:x.name, phone:x.phone, email:'', group:f.elements.group.value, rsvp:f.elements.rsvp.value, plusOnes:x.plus, diet:'None', tableId:'', notes:''}));
    store.set('guests', all); syncGuestCounts(eventId); closeModal(); toast(`${list.length} guests added`); refresh();
  });
}
function deleteGuest(id){
  const all = store.get('guests',[]); const idx = all.findIndex(x=>x.id===id); if(idx<0) return;
  const [rm] = all.splice(idx,1); store.set('guests', all); syncGuestCounts(rm.eventId); refresh();
  toast(`${esc(rm.name)} removed`, {label:'Undo', fn:()=>{ const a2=store.get('guests',[]); a2.splice(idx,0,rm); store.set('guests',a2); syncGuestCounts(rm.eventId); refresh(); }});
}
function copyText(txt, ok){ try{ navigator.clipboard.writeText(txt).then(()=>toast(ok), ()=>toast('Copy was blocked by the browser')); }catch(e){ toast('Copy was blocked by the browser'); } }

/* =========================================================
   SEATING PLAN
========================================================= */
let seatSel = null, seatGuestSel = null, seatShowPending = false, seatQuery = '';
function renderSeating(){ seatGuestSel = null; pickPage('Seating Plan','Drag guests onto tables, and drag tables to arrange the room', (el, id) => seatingManager(el, id)); }
function seatingManager(el, eventId){
  const tables = store.get('tables',[]).filter(t=>t.eventId===eventId);
  const guests = store.get('guests',[]).filter(g=>g.eventId===eventId && g.rsvp!=='Declined');
  const used = Object.fromEntries(tables.map(t=>[t.id,0]));
  guests.forEach(g => { if(g.tableId && used[g.tableId]!=null) used[g.tableId] += 1+(+g.plusOnes||0); });
  const seatedHead = guests.filter(g=>g.tableId && used[g.tableId]!=null).reduce((s,g)=>s+1+(+g.plusOnes||0),0);
  const confirmedHead = guests.filter(g=>g.rsvp==='Confirmed').reduce((s,g)=>s+1+(+g.plusOnes||0),0);
  const totalSeats = tables.reduce((s,t)=>s+(+t.seats||0),0);
  const q = seatQuery.trim().toLowerCase();
  const unseated = guests.filter(g => (!g.tableId || used[g.tableId]==null) && (seatShowPending || g.rsvp==='Confirmed') && (!q || g.name.toLowerCase().includes(q) || g.group.toLowerCase().includes(q))).sort((a,b)=>a.group.localeCompare(b.group)||a.name.localeCompare(b.name));
  if(seatSel && !tables.some(t=>t.id===seatSel)) seatSel = null;
  const selT = tables.find(t=>t.id===seatSel);
  const tableHTML = t => {
    const u = used[t.id], cap = +t.seats||0, p = cap ? Math.min(100, u/cap*100) : 0;
    const fillc = u>=cap && cap ? 'var(--emerald)' : u ? 'var(--plum)' : 'var(--grey)';
    const rect = t.shape==='rect';
    const size = rect ? {w: 60 + cap*7, h: 54} : {w: 64 + cap*1.6, h: 64 + cap*1.6};
    let seats = '';
    for(let i=0;i<cap;i++){
      if(rect){ const perSide = Math.ceil(cap/2), side = i < perSide ? -1 : 1, idx = i % perSide; const x = (idx+0.5)/perSide*size.w - size.w/2; seats += `<span class="seat ${i<u?'on':''}" style="transform:translate(calc(-50% + ${x}px), calc(-50% + ${side*(size.h/2+11)}px))"></span>`; }
      else { const a = i/cap*Math.PI*2 - Math.PI/2, r = size.w/2 + 11; seats += `<span class="seat ${i<u?'on':''}" style="transform:translate(calc(-50% + ${Math.cos(a)*r}px), calc(-50% + ${Math.sin(a)*r}px))"></span>`; }
    }
    return `<div class="s-table ${rect?'rect':''} ${t.id===seatSel?'sel':''}" data-tid="${t.id}" style="left:${t.x}%;top:${t.y}%;--fillc:${fillc}">
      <div class="s-top" style="width:${size.w}px;height:${size.h}px"><span class="s-fill" style="--p:${p}"></span><div><b>${esc(t.name)}</b><span>${u}/${cap}</span></div></div>${seats}</div>`;
  };
  el.innerHTML = `
    <div class="stat-strip">
      <div class="ss"><span class="chip t-plum">${ic('seating')}</span><div><small>Tables</small><b>${tables.length}</b></div></div>
      <div class="ss"><span class="chip t-emerald">${ic('check')}</span><div><small>Seated</small><b>${seatedHead} <span style="font-size:13px;color:var(--muted);font-weight:600">/ ${confirmedHead} confirmed</span></b></div></div>
      <div class="ss"><span class="chip t-sky">${ic('guests')}</span><div><small>Free seats</small><b>${Math.max(0,totalSeats-seatedHead)}</b></div></div>
      <div class="ss"><span class="chip ${confirmedHead>totalSeats?'t-red':'t-amber'}">${ic('alert')}</span><div><small>${confirmedHead>totalSeats?'Seats short':'Seats total'}</small><b>${confirmedHead>totalSeats ? confirmedHead-totalSeats : totalSeats}</b></div></div>
    </div>
    <div class="seat-wrap">
      <div class="seat-side">
        ${selT ? `<div class="panel">
          <div class="p-head" style="margin-bottom:6px"><div><h3>${esc(selT.name)}</h3><p>${used[selT.id]} of ${selT.seats} seats · ${selT.shape==='rect'?'Long table':'Round table'}</p></div><button class="icon-btn" style="width:32px;height:32px" data-seat-close aria-label="Close">${ic('x')}</button></div>
          <div class="tbl-guests">${guests.filter(g=>g.tableId===selT.id).map(g=>`<div><span class="av" style="width:24px;height:24px;font-size:9px;background:${avColor(g.name)}">${initials(g.name)}</span><b>${esc(g.name)}</b>${+g.plusOnes?`<span class="party">+${g.plusOnes}</span>`:''}<button data-unseat="${g.id}" title="Remove from table">${ic('x')}</button></div>`).join('') || '<p style="font-size:12.5px;color:var(--muted);padding:8px 0">No one seated yet. Drag guests here.</p>'}</div>
          <div style="display:flex;gap:8px"><button class="btn btn-ghost" style="height:36px;flex:1;justify-content:center" data-tbl-edit="${selT.id}">${ic('edit')}Edit</button><button class="btn btn-ghost" style="height:36px;color:var(--red)" data-tbl-del="${selT.id}" title="Delete table">${ic('trash')}</button></div>
        </div>` : ''}
        <div class="panel">
          <div class="p-head" style="margin-bottom:10px"><div><h3>Unseated guests</h3><p>${unseated.length} parties · ${unseated.reduce((s,g)=>s+1+(+g.plusOnes||0),0)} people</p></div></div>
          <label class="tsearch" style="margin-bottom:8px">${ic('search')}<input id="sQ" placeholder="Search…" value="${esc(seatQuery)}" style="width:100%"></label>
          <label class="chk" style="padding:0 0 10px"><input type="checkbox" id="sPend" ${seatShowPending?'checked':''}>Include pending / maybe</label>
          <div class="g-list">${unseated.map(g=>`<div class="g-chip ${g.id===seatGuestSel?'sel':''}" draggable="true" data-gid="${g.id}"><span class="av" style="background:${avColor(g.name)}">${initials(g.name)}</span><b>${esc(g.name)}<br><small>${esc(g.group)}${g.rsvp!=='Confirmed'?' · '+g.rsvp:''}</small></b>${+g.plusOnes?`<span class="party">+${g.plusOnes}</span>`:''}</div>`).join('') || `<div class="empty" style="padding:20px 6px">${guests.length ? '🎉 Everyone is seated!' : 'No guests yet. Add them in Guests & RSVP.'}</div>`}</div>
          <div class="seat-hint">${ic('move')}Drag onto a table, or tap a guest then a table</div>
        </div>
      </div>
      <div class="panel" style="padding:14px">
        <div class="toolbar" style="padding:0;margin-bottom:12px">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-primary" style="height:38px" data-tbl-add="round">${ic('plus')}Round table</button>
            <button class="btn btn-ghost" style="height:38px" data-tbl-add="rect">${ic('plus')}Long table</button>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-ghost" style="height:38px" data-seat-auto>${ic('wand')}Auto-seat</button>
            <button class="btn btn-ghost" style="height:38px" data-seat-clear>${ic('xc')}Clear seats</button>
          </div>
        </div>
        <div class="s-canvas-wrap"><div class="s-canvas" id="sCanvas"><div class="stage">STAGE</div>${tables.map(tableHTML).join('')}${!tables.length?`<div class="empty" style="position:absolute;inset:0;display:grid;place-items:center">Add your first table to start the floor plan.</div>`:''}</div></div>
        <div class="legend-row"><span><i style="background:var(--grey)"></i>Empty</span><span><i style="background:var(--plum)"></i>Partly filled</span><span><i style="background:var(--emerald)"></i>Full</span><span style="margin-left:auto">Drag tables to move them · click a table to see who's there</span></div>
      </div>
    </div>`;
  const sq = el.querySelector('#sQ'); sq.addEventListener('input', e => { seatQuery = e.target.value; seatingManager(el, eventId); const n = el.querySelector('#sQ'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); });
  el.querySelector('#sPend').onchange = e => { seatShowPending = e.target.checked; seatingManager(el, eventId); };
  wireCanvas(el, eventId);
}
function assignGuest(gid, tid){
  const all = store.get('guests',[]); const g = all.find(x=>x.id===gid); const t = store.get('tables',[]).find(x=>x.id===tid);
  if(!g || !t) return;
  const used = all.filter(x=>x.tableId===tid && x.id!==gid && x.rsvp!=='Declined').reduce((s,x)=>s+1+(+x.plusOnes||0),0);
  const need = 1+(+g.plusOnes||0);
  if(used + need > t.seats){ toast(`${esc(t.name)} has ${t.seats-used} free seat${t.seats-used===1?'':'s'}. ${esc(g.name)}'s party needs ${need}.`); return; }
  g.tableId = tid; store.set('guests', all); seatGuestSel = null; seatSel = tid;
  toast(`${esc(g.name)} seated at ${esc(t.name)}`); refresh();
}
function wireCanvas(el, eventId){
  const canvas = el.querySelector('#sCanvas');
  // guest drag & drop
  el.querySelectorAll('.g-chip').forEach(c => {
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/guest', c.dataset.gid); e.dataTransfer.effectAllowed='move'; });
    c.addEventListener('click', () => { seatGuestSel = seatGuestSel===c.dataset.gid ? null : c.dataset.gid; el.querySelectorAll('.g-chip').forEach(x=>x.classList.toggle('sel', x.dataset.gid===seatGuestSel)); if(seatGuestSel) toast('Now tap a table to seat this guest'); });
  });
  canvas.addEventListener('dragover', e => { const t = e.target.closest('.s-table'); if(!t || !e.dataTransfer.types.includes('text/guest')) return; e.preventDefault(); canvas.querySelectorAll('.drop').forEach(x=>x!==t&&x.classList.remove('drop')); t.classList.add('drop'); });
  canvas.addEventListener('dragleave', e => { const t = e.target.closest('.s-table'); if(t && !t.contains(e.relatedTarget)) t.classList.remove('drop'); });
  canvas.addEventListener('drop', e => { const t = e.target.closest('.s-table'); if(!t) return; e.preventDefault(); t.classList.remove('drop'); const gid = e.dataTransfer.getData('text/guest'); if(gid) assignGuest(gid, t.dataset.tid); });
  // move tables with pointer
  canvas.querySelectorAll('.s-table').forEach(tEl => {
    tEl.addEventListener('pointerdown', e => {
      if(e.button!==0) return;
      const rect = canvas.getBoundingClientRect(); const sx = e.clientX, sy = e.clientY; let moved = false;
      const startL = parseFloat(tEl.style.left), startT = parseFloat(tEl.style.top);
      tEl.setPointerCapture(e.pointerId);
      const mv = ev => { const dx = ev.clientX - sx, dy = ev.clientY - sy; if(!moved && Math.hypot(dx,dy) < 5) return; moved = true; tEl.classList.add('dragging');
        tEl.style.left = Math.min(96, Math.max(4, startL + dx/rect.width*100)) + '%'; tEl.style.top = Math.min(95, Math.max(9, startT + dy/rect.height*100)) + '%'; };
      const up = () => { tEl.removeEventListener('pointermove', mv); tEl.removeEventListener('pointerup', up); tEl.classList.remove('dragging');
        if(moved){ const all = store.get('tables',[]); const t = all.find(x=>x.id===tEl.dataset.tid); t.x = +parseFloat(tEl.style.left).toFixed(2); t.y = +parseFloat(tEl.style.top).toFixed(2); store.set('tables', all); }
        else if(seatGuestSel) assignGuest(seatGuestSel, tEl.dataset.tid);
        else { seatSel = seatSel===tEl.dataset.tid ? null : tEl.dataset.tid; refresh(); } };
      tEl.addEventListener('pointermove', mv); tEl.addEventListener('pointerup', up);
    });
  });
}
function addTable(eventId, shape){
  const all = store.get('tables',[]); const mine = all.filter(t=>t.eventId===eventId);
  // choose the open spot that is furthest from every existing table
  let x = 50, y = 50, best = -1;
  for(let cx = 8; cx <= 92; cx += 3) for(let cy = 14; cy <= 93; cy += 3){
    const d = mine.length ? Math.min(...mine.map(t => Math.hypot((t.x-cx)*8, (t.y-cy)*7.8))) : 999;
    if(d > best){ best = d; x = cx; y = cy; }
  }
  const n = mine.length + 1;
  const t = {id:uid('tb'), eventId, name: shape==='rect' ? `Long Table ${n}` : `Table ${n}`, shape, seats: shape==='rect' ? 12 : 10, x:+x.toFixed(2), y:+y.toFixed(2)};
  all.push(t); store.set('tables', all); seatSel = t.id; toast(`${t.name} added`); refresh();
}
function openTableForm(id){

  const seated = store.get('guests',[]).filter(g=>g.tableId===id && g.rsvp!=='Declined').reduce((s,g)=>s+1+(+g.plusOnes||0),0);

      <div class="field"><label for="tb_seats">Seats</label><input id="tb_seats" name="seats" type="number" min="1" max="30" value="${t.seats}"><small class="err"></small></div>

  const f = document.getElementById('tbForm');
  f.addEventListener('submit', ev => { ev.preventDefault();
    const fail = (n,m) => { const b = f.elements[n].closest('.field'); b.classList.add('invalid'); b.querySelector('.err').textContent = m; f.elements[n].focus(); };
    const seats = Math.round(+f.elements.seats.value||0);
    if(!f.elements.name.value.trim()) return fail('name','Please enter a name');
    if(seats < 1 || seats > 30) return fail('seats','Between 1 and 30 seats');
    if(seats < seated) return fail('seats',`${seated} people are already seated here`);
    const all = store.get('tables',[]); Object.assign(all.find(x=>x.id===id), {name:f.elements.name.value.trim(), seats, shape:f.elements.shape.value}); store.set('tables', all);
    closeModal(); toast('Table updated'); refresh(); });

function deleteTable(id){
  const tAll = store.get('tables',[]); const idx = tAll.findIndex(x=>x.id===id); if(idx<0) return;
  const [rm] = tAll.splice(idx,1); store.set('tables', tAll);
  const gAll = store.get('guests',[]); const moved = gAll.filter(g=>g.tableId===id).map(g=>g.id); gAll.forEach(g=>{ if(g.tableId===id) g.tableId=''; }); store.set('guests', gAll);
  seatSel = null; refresh();
  toast(`${esc(rm.name)} deleted${moved.length?` · ${moved.length} parties unseated`:''}`, {label:'Undo', fn:()=>{ const t2=store.get('tables',[]); t2.splice(idx,0,rm); store.set('tables',t2); const g2=store.get('guests',[]); g2.forEach(g=>{ if(moved.includes(g.id)) g.tableId=id; }); store.set('guests',g2); refresh(); }});
}
function autoSeat(eventId){
  const tables = store.get('tables',[]).filter(t=>t.eventId===eventId);
  if(!tables.length){ toast('Add some tables first'); return; }
  const all = store.get('guests',[]);
  const used = Object.fromEntries(tables.map(t=>[t.id,0]));
  all.filter(g=>g.eventId===eventId && g.tableId && used[g.tableId]!=null && g.rsvp!=='Declined').forEach(g => used[g.tableId] += 1+(+g.plusOnes||0));
  const todo = all.filter(g=>g.eventId===eventId && g.rsvp==='Confirmed' && (!g.tableId || used[g.tableId]==null)).sort((a,b)=>a.group.localeCompare(b.group) || (b.plusOnes-a.plusOnes));
  let placed = 0, left = 0;
  todo.forEach(g => { const need = 1+(+g.plusOnes||0);
    // prefer a table already holding the same group
    const sameGroup = tables.find(t => used[t.id]+need <= t.seats && all.some(o=>o.tableId===t.id && o.group===g.group));
    const t = sameGroup || tables.find(t => used[t.id]+need <= t.seats);
    if(t){ g.tableId = t.id; used[t.id] += need; placed++; } else left++; });
  store.set('guests', all); refresh();
  toast(placed ? `${placed} parties seated by group${left?` · ${left} still need seats, so add more tables`:''}` : left ? `No free seats. ${left} parties need a table.` : 'All confirmed guests are already seated');
}
function clearSeats(eventId){
  const all = store.get('guests',[]); const prev = all.filter(g=>g.eventId===eventId && g.tableId).map(g=>[g.id,g.tableId]);
  if(!prev.length){ toast('No one is seated yet'); return; }
  all.forEach(g=>{ if(g.eventId===eventId) g.tableId=''; }); store.set('guests', all); refresh();
  toast(`${prev.length} parties unseated`, {label:'Undo', fn:()=>{ const a2=store.get('guests',[]); const m = Object.fromEntries(prev); a2.forEach(g=>{ if(m[g.id]) g.tableId=m[g.id]; }); store.set('guests',a2); refresh(); }});
}

let tkEvent = 'All', tkPri = 'All', tkWho = 'All', tkQuery = '', tkShowDone = false;

    </div>
    <div class="panel toolbar">
      <label class="tsearch" style="flex:1;min-width:180px">${ic('search')}<input id="tkQ" style="width:100%" placeholder="Search tasks…" value="${esc(tkQuery)}"></label>
      <div class="tb-right">
        <select class="sel" id="tkEv"><option value="All">All events</option>${evWithTasks.map(e=>`<option value="${e.id}" ${e.id===tkEvent?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
        <select class="sel" id="tkPr"><option value="All">Any priority</option>${['High','Medium','Low'].map(p=>`<option ${p===tkPri?'selected':''}>${p}</option>`).join('')}</select>
        <select class="sel" id="tkWh"><option value="All">Anyone</option><option value="" ${tkWho===''?'selected':''}>Unassigned</option>${people.map(p=>`<option ${p===tkWho?'selected':''}>${esc(p)}</option>`).join('')}</select>
        <label class="chk"><input type="checkbox" id="tkDone" ${tkShowDone?'checked':''}>Show completed</label>
      </div>
    </div>
    <div class="panel" id="tkBody"></div>
  </div>`;
  const draw = () => {
    const q = tkQuery.trim().toLowerCase();
    const list = tasks.filter(t => (tkEvent==='All'||t.eventId===tkEvent) && (tkPri==='All'||(t.priority||'Medium')===tkPri) && (tkWho==='All'||(t.assignee||'')===tkWho) && (!q || [t.title,t.assignee,evMap[t.eventId].name].join(' ').toLowerCase().includes(q)));
    const pw = {High:0, Medium:1, Low:2};
    const sortT = arr => arr.sort((a,b)=>a.due.localeCompare(b.due) || pw[a.priority||'Medium']-pw[b.priority||'Medium']);
    const op = list.filter(t=>!t.done);
    const buckets = [
      ['Overdue','t-red', op.filter(t=>daysUntil(t.due)<0)],
      ['Today','t-rose', op.filter(t=>daysUntil(t.due)===0)],
      ['Next 7 days','t-amber', op.filter(t=>{const d=daysUntil(t.due); return d>=1 && d<=7;})],
      ['Later','t-grey', op.filter(t=>daysUntil(t.due)>7)],
      ...(tkShowDone ? [['Completed','t-emerald', list.filter(t=>t.done)]] : [])

    document.getElementById('tkBody').innerHTML = buckets.length ? buckets.map(([name, cls, arr]) => `<div class="bucket">${name}<span class="${cls}">${arr.length}</span></div>${sortT(arr).map(t=>taskRow(t,{showEvent:true})).join('')}`).join('') : `<div class="empty">${op.length===0 && list.length ? '🎉 All done here!' : 'No tasks match your filters.'}</div>`;
  };
  draw();
  document.getElementById('tkQ').addEventListener('input', e => { tkQuery = e.target.value; draw(); });
  document.getElementById('tkEv').onchange = e => { tkEvent = e.target.value; draw(); };
  document.getElementById('tkPr').onchange = e => { tkPri = e.target.value; draw(); };
  document.getElementById('tkWh').onchange = e => { tkWho = e.target.value; draw(); };
  document.getElementById('tkDone').onchange = e => { tkShowDone = e.target.checked; draw(); };
}

function saveEventAsTemplate(eventId){
  const e = findEvent(eventId); if(!e) return;
  const tasks = getTasks().filter(t=>t.eventId===eventId).map(t=>({title:t.title, days:Math.max(0, daysUntil(e.date)-daysUntil(t.due)), priority:t.priority||'Medium'}));
  const tl = store.get('timeline',[]).filter(x=>x.eventId===eventId).sort((a,b)=>toMin(a.time)-toMin(b.time));
  const base = toMin(e.time || (tl.find(x=>x.category!=='Setup')||tl[0]||{time:'18:00'}).time);
  openTemplateEditor(null, {name:`${e.name} plan`, type:e.type, description:`Based on ${e.name} (${fmtDate(e.date)}).`, tasks, timeline:tl.map(x=>({off:toMin(x.time)-base, dur:+x.duration||0, title:x.title, cat:x.category}))});
}

function formModal({title, sub='', fields, submit='Save', wide=false, onSubmit}){
  const fh = f => {
    const id = 'fm_'+f.name, req = f.required ? ' *' : '', cls = `field ${f.full?'full':''}`;
    if(f.type==='section') return `<div class="field full"><div class="ag-sec" style="margin:6px 0 0">${f.label}</div></div>`;
    if(f.type==='select') return `<div class="${cls}"><label for="${id}">${f.label}${req}</label><select id="${id}" name="${f.name}">${f.options.map(o => { const [val,lab] = Array.isArray(o) ? o : [o,o]; return `<option value="${esc(val)}" ${String(val)===String(f.value??'')?'selected':''}>${esc(lab)}</option>`; }).join('')}</select><small class="err"></small></div>`;
    if(f.type==='textarea') return `<div class="${cls}"><label for="${id}">${f.label}${req}</label><textarea id="${id}" name="${f.name}" maxlength="${f.max||600}" placeholder="${esc(f.placeholder||'')}">${esc(f.value??'')}</textarea><small class="err"></small></div>`;
    if(f.type==='checkbox') return `<div class="${cls}"><label class="chk" style="padding:0"><input type="checkbox" name="${f.name}" ${f.value?'checked':''}>${f.label}</label></div>`;
    if(f.type==='chips') return `<div class="${cls}"><label>${f.label}</label><div class="chk-grid">${f.options.map(o=>`<label><input type="checkbox" name="${f.name}" value="${esc(o)}" ${(f.value||[]).includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div></div>`;
    if(f.type==='html') return f.html;
    return `<div class="${cls}"><label for="${id}">${f.label}${req}</label><input id="${id}" name="${f.name}" type="${f.type||'text'}" value="${esc(f.value??'')}" placeholder="${esc(f.placeholder||'')}" ${f.attrs||''} ${f.list?`list="${f.list}"`:''}>${f.datalist?`<datalist id="${f.list}">${f.datalist.map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}<small class="err"></small></div>`;
  };
  openModal(`<form class="modal-card" id="fmForm" novalidate ${wide?'style="width:min(820px,100%)"':''}>
    <div class="m-head"><div><h3 class="serif">${title}</h3>${sub?`<p>${sub}</p>`:''}</div><button type="button" class="icon-btn" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="m-body"><div class="form-grid">${fields.map(fh).join('')}</div></div>
    <div class="m-foot"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" type="submit">${ic('checkSm')}${submit}</button></div></form>`);
  const form = document.getElementById('fmForm');
  const first = form.querySelector('input:not([type=checkbox]),select,textarea'); if(first) setTimeout(()=>{ if(!form.contains(document.activeElement)) first.focus(); },50);
  form.addEventListener('submit', ev => {
    ev.preventDefault();
    form.querySelectorAll('.field').forEach(x=>{x.classList.remove('invalid'); const er=x.querySelector('.err'); if(er) er.textContent='';});
    let bad = false;
    const fail = (n, m) => { if(bad) return false; bad = true; const el = form.elements.namedItem(n); const box = (el.length && !el.tagName ? el[0] : el).closest('.field'); box.classList.add('invalid'); const er = box.querySelector('.err'); if(er) er.textContent = m; (el.focus ? el : el[0]).focus(); return false; };
    const data = {};
    fields.forEach(f => {
      if(['section','html'].includes(f.type)) return;
      const el = form.elements.namedItem(f.name);
      let v;
      if(f.type==='checkbox') v = el.checked;
      else if(f.type==='chips') v = [...form.querySelectorAll(`input[name="${f.name}"]:checked`)].map(i=>i.value);
      else if(f.type==='number') v = el.value==='' ? '' : Math.max(f.min ?? 0, +el.value);
      else v = el.value.trim();
      data[f.name] = v;
      if(f.required && (v==='' || v==null)) fail(f.name, f.requiredMsg || 'This field is required');
      if(f.type==='email' && v && !isEmail(v)) fail(f.name, 'Please enter a valid email');
    });
    if(bad) return;
    if(onSubmit(data, fail) === false || bad) return;
    closeModal(); refresh();
  });
}
function removeWithUndo(key, id, label){

function upsert(key, existing, data, prefix){

}
