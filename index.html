const DECOR_AREAS = ['Entrance','Stage','Tables & centrepieces','Ceiling & lighting','Florals','Signage & stationery','Photo booth','Other'];
const DECOR_STATUS = {Idea:'t-grey', Approved:'t-sky', Ordered:'t-amber', Ready:'t-emerald'};
const DEFAULT_PALETTE = ['#5b2a6e','#e2557f','#f6efe3','#0f9f78','#ffffff','#1c1a20'];
function stylingManager(el, eventId){
  const st = getCfg('styling', eventId, {theme:'', palette:DEFAULT_PALETTE, moods:[], notes:'', images:[]});
  const items = store.get('decor',[]).filter(d=>d.eventId===eventId);
  const pal = (st.palette && st.palette.length ? st.palette : DEFAULT_PALETTE);
  const ready = items.filter(i=>i.status==='Ready').length, cost = items.reduce((s,i)=>s+(+i.cost||0),0);
  const lum = h => { const n = parseInt(h.slice(1),16); return ((n>>16)*299 + ((n>>8&255)*587) + ((n&255)*114))/1000; };
  const darkest = [...pal].sort((a,b)=>lum(a)-lum(b));
  el.innerHTML = `
    <div class="theme-hero" style="background:linear-gradient(125deg, ${darkest[0]} 0%, ${darkest[1]} 45%, ${darkest[Math.min(3,darkest.length-1)]} 100%)">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><span class="eyebrow">Theme</span><button class="btn btn-glass" style="height:36px" data-style-edit="${eventId}">${ic('edit')}Edit theme</button></div>
      <h3>${st.theme ? esc(st.theme) : 'No theme yet'}</h3>
      <div class="moods">${(st.moods||[]).map(m=>`<span>${esc(m)}</span>`).join('') || '<span>Add mood words like “Regal”, “Boho”, “Minimal”</span>'}</div>
      <div class="swatches">${pal.map(c=>`<button class="sw" data-copy-hex="${c}" title="Copy ${c}"><i style="background:${c}"></i><small>${c.toUpperCase()}</small></button>`).join('')}</div>
      ${st.notes ? `<p style="margin-top:16px;max-width:720px;opacity:.92;font-size:13.5px;line-height:1.6">${esc(st.notes)}</p>` : ''}
    </div>
    <div class="two-col">
      <div class="panel">
        <div class="p-head"><div><h3>Décor checklist</h3><p>${items.length} items · ${ready} ready · ${money(cost)} estimated</p></div><button class="btn btn-primary" style="height:38px" data-decor-new="${eventId}">${ic('plus')}Add item</button></div>
        ${items.length ? `<div class="mini-bar" style="height:8px;margin:0 0 16px"><div style="width:${items.length?ready/items.length*100:0}%;background:linear-gradient(90deg,var(--plum),var(--rose))"></div></div>` + DECOR_AREAS.filter(a=>items.some(i=>i.area===a)).map(a=>`<div class="t-sec">${esc(a)}</div>${items.filter(i=>i.area===a).map(i=>`<div class="dish"><b>${esc(i.item)}</b>${+i.cost?`<span style="font-size:12.5px;font-weight:700;white-space:nowrap">${moneyShort(+i.cost)}</span>`:''}${statusSel('decor', i.id, DECOR_STATUS, i.status)}<div class="acts"><button title="Edit" data-decor-edit="${i.id}">${ic('edit')}</button><button title="Remove" class="del" data-decor-del="${i.id}">${ic('trash')}</button></div></div>`).join('')}`).join('') : `<div class="empty">Plan the entrance, stage, tables, lighting and more.</div>`}
      </div>
      <div class="panel">
        <div class="p-head"><div><h3>Mood board</h3><p>${(st.images||[]).length}/12 images · saved in this browser</p></div></div>
        <div class="mood-grid">
          ${(st.images||[]).map((src,i)=>`<div class="mood-img"><img src="${src}" alt="Inspiration ${i+1}"><button data-mood-del="${eventId}|${i}" aria-label="Remove image">${ic('x')}</button></div>`).join('')}
          ${(st.images||[]).length < 12 ? `<label class="mood-add">${ic('image')}Add images<input type="file" accept="image/*" multiple data-mood-add="${eventId}"></label>` : ''}
        </div>
        <div class="seat-hint">${ic('image')}Upload inspiration photos from your phone or computer. They're resized to save space.</div>
      </div>
    </div>`;
  const inp = el.querySelector('[data-mood-add]');
  if(inp) inp.onchange = async ev => {
    const files = [...ev.target.files].slice(0, 12 - (st.images||[]).length); if(!files.length) return;
    const shrink = f => new Promise(res => { const img = new Image(); const url = URL.createObjectURL(f); img.onload = () => { const max = 600, sc = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .72)); }; img.onerror = () => { URL.revokeObjectURL(url); res(null); }; img.src = url; });
    const out = (await Promise.all(files.map(shrink))).filter(Boolean);
    const all = store.get('styling',[]); let rec = all.find(x=>x.eventId===eventId); if(!rec){ rec = {id:uid('st'), eventId, theme:'', palette:DEFAULT_PALETTE, moods:[], notes:'', images:[]}; all.push(rec); }

    catch(err){ toast('Browser storage is full. Try fewer or smaller images.'); }
    refresh();
  };
}

const INV_CATS = ['Furniture','Linen','Décor','Lighting','Signage','Tableware','Sound & AV','Other'];

function invUsage(itemId){
  const evMap = Object.fromEntries(getEvents().map(e=>[e.id,e]));
  const al = store.get('allocations',[]).filter(a=>a.itemId===itemId && evMap[a.eventId] && evMap[a.eventId].status!=='Cancelled');
  const byDate = {}; al.forEach(a => { const d = evMap[a.eventId].date; byDate[d] = (byDate[d]||0) + (+a.qty||0); });
  const upcoming = Object.entries(byDate).filter(([d])=>daysUntil(d)>=0);
  const peak = upcoming.length ? Math.max(...upcoming.map(x=>x[1])) : 0;
  return {al, byDate, peak, upcomingEvents: al.filter(a=>daysUntil(evMap[a.eventId].date)>=0).length};
}

    const usedThatDay = all.filter(a=>a.itemId===item.id && evDates[a.eventId]===ev.date && a!==existing).reduce((s,a)=>s+(+a.qty||0),0);
    const free = (+item.qty||0) - usedThatDay;
    if(+data.qty > free) return fail('qty', `Only ${Math.max(0,free)} free on ${fmtDate(ev.date)}${usedThatDay?` (${usedThatDay} already reserved that day)`:''}`);
    if(existing) existing.qty = +data.qty; else all.push({id:uid('al'), itemId:item.id, eventId:ev.id, qty:+data.qty});
    store.set('allocations', all); toast(`${data.qty} × ${esc(item.name)} reserved for ${esc(ev.name)}`);
  }});
}

  const bookedNames = new Set(lines.filter(l=>l.src==='vendor').map(l=>l.item.split(' — ')[0].toLowerCase()));

function vendorPayables(){

function promoCheck(eventId, code, sub){
  code = (code||'').trim().toUpperCase(); if(!code) return {ok:true, disc:0};
  const p = store.get('promoCodes',[]).find(x=>x.eventId===eventId && x.code===code);
  if(!p) return {ok:false, msg:'Code not found'};
  if(p.expires && daysUntil(p.expires) < 0) return {ok:false, msg:'This code has expired'};
  if(p.maxUses && promoUses(p) >= p.maxUses) return {ok:false, msg:'This code has been fully used'};
  const disc = Math.min(sub, p.type==='%' ? Math.round(sub*p.value/100) : +p.value);
  return {ok:true, disc, p, msg:`${p.type==='%'?p.value+'%':money(p.value)} off applied`};
}

function fillMsg(body, eventId, r){

  const vals = {name:(r?.name||'Guest').split(' ')[0], event:e.name, date:d, time:e.time?fmtTime(e.time):'as per the invitation', time_at:e.time?` at ${fmtTime(e.time)}`:'', venue:e.venue||'the venue', venue_at:e.venue?`, ${e.venue}`:'', host:e.client, balance:money(Math.max(0,e.budget-e.collected)), setup_time:setup, ...Object.fromEntries(Object.entries(r||{}).map(([k,v])=>[k,String(v)]))};

function wrapupDetail(el, eventId){
  const e = findEvent(eventId); if(!e){ el.innerHTML=''; return; }
  const w = store.get('wrapups',[]).find(x=>x.eventId===eventId);
  const lines = budgetLinesFor(eventId); const costs = lines.reduce((s,l)=>s+committed(l),0);
  const paidOut = lines.reduce((s,l)=>s+(+l.paid||0),0);
  const profit = (+e.budget||0) - costs;

  pill.className = 'saved ' + ({off:'s-off', ok:'s-ok', busy:'s-busy', offline:'s-err', err:'s-err', ro:'s-busy'}[st]||'');
  pill.querySelector('span').textContent = txt;
  pill.title = st==='ok' && SYNC.lastSync ? `Last synced ${new Date(SYNC.lastSync).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}` : (SYNC.err || txt);

function scheduleSync(){ if(!SYNC.on) return; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(pushDirty, 1200); if(SYNC.status==='ok') setSyncStatus('busy'); }
async function writeKey(k){
  const json = localStorage.getItem('eventora_'+k);
  const coll = syncColl(); const t = rawGet('mtime',{})[k] || Date.now(); const dev = devId();
  if(json==null){ await coll.doc(k).set({k, deleted:true, part:0, t, dev}); return t; }
  const parts = Math.max(1, Math.ceil(json.length / CHUNK));
  for(let i=1;i<parts;i++) await coll.doc(k+'~'+i).set({k, part:i, t, s:json.slice(i*CHUNK, (i+1)*CHUNK)});
  await coll.doc(k).set({k, part:0, parts, t, dev, s:json.slice(0, CHUNK)});
  const old = (SYNC.remote[k]||{}).parts || 1; for(let i=parts;i<old;i++){ try{ await coll.doc(k+'~'+i).delete(); }catch(e){} }
  SYNC.remote[k] = {t, dev, parts};
  return t;
}
async function pushDirty(){
  if(!SYNC.on || !SYNC.db || SYNC.pushing) return;
  if(!SYNC.canWrite){ rawSet('syncDirty', []); setSyncStatus('ro'); return; }
  if(navigator.onLine === false){ setSyncStatus('offline'); return; }
  SYNC.pushing = true; setSyncStatus('busy');
  try{
    let dirty = rawGet('syncDirty', []);
    while(dirty.length){
      const k = dirty[0];
      const t = await writeKey(k);
      const meta = rawGet('syncMeta', {}); meta[k] = t; rawSet('syncMeta', meta);
      dirty = rawGet('syncDirty', []).filter(x => x!==k || (rawGet('mtime',{})[x]||0) > t); rawSet('syncDirty', dirty);
    }
    SYNC.lastSync = Date.now(); setSyncStatus('ok', '');
  }catch(e){
    const code = e && e.code;
    if(code==='invalid_argument' && SYNC.mode==='team'){ SYNC.canWrite = false; setSyncStatus('ro', 'You can view the team workspace but not change it.'); }
    else if(code==='quota_exceeded'){ setSyncStatus('err', 'Cloud storage is full. Remove large images (mood board, documents) and try again.'); }
    else if(code==='revoked'){ SYNC.on = false; setSyncStatus('err', 'Sync access was removed for this view.'); }
    else { setSyncStatus(navigator.onLine===false ? 'offline' : 'err', 'Could not reach the cloud. Retrying…'); setTimeout(pushDirty, 15000 + Math.random()*5000); }
  }finally{ SYNC.pushing = false; }
}
function assemble(docs){
  const byKey = {}; docs.forEach(d => { const x = d.data(); if(!x || !x.k) return; (byKey[x.k] = byKey[x.k] || {})[x.part||0] = x; });
  const out = {};
  Object.entries(byKey).forEach(([k, parts]) => { const head = parts[0]; if(!head) return;
    if(head.deleted){ out[k] = {t:head.t, dev:head.dev, deleted:true, parts:1}; return; }
    let s = head.s || ''; let ok = true; for(let i=1;i<(head.parts||1);i++){ const p = parts[i]; if(!p || p.t!==head.t){ ok = false; break; } s += p.s; }
    if(ok) out[k] = {t:head.t, dev:head.dev, json:s, parts:head.parts||1}; });
  return out;
}
function applyRemote(remote, force){
  Object.assign(SYNC.remote, remote);
  const meta = rawGet('syncMeta', {}), mt = rawGet('mtime', {}), dirty = new Set(rawGet('syncDirty', []));
  const changed = [];
  Object.entries(remote).forEach(([k, r]) => {
    if(LOCAL_ONLY.has(k)) return;
    if(!force && (meta[k]||0) >= r.t) return;
    if(!force && dirty.has(k) && (mt[k]||0) > r.t) return;   // our newer local edit wins
    try{ if(r.deleted) localStorage.removeItem('eventora_'+k); else { JSON.parse(r.json); localStorage.setItem('eventora_'+k, r.json); } }catch(e){ return; }
    meta[k] = r.t; mt[k] = r.t; dirty.delete(k); changed.push(k);
  });
  rawSet('syncMeta', meta); rawSet('mtime', mt); rawSet('syncDirty', [...dirty]);
  if(changed.length){
    if(changed.includes('settings')){ CUR = getSettings().currency; applyBrand(); }

  return changed;
}
function queueRemoteRefresh(){
  const busy = () => document.getElementById('modalBg').classList.contains('open') || (document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && document.getElementById('content').contains(document.activeElement));
  const doIt = () => { if(busy()){ setTimeout(doIt, 2500); return; } SYNC.pendingRefresh = false; refresh(); };

}
async function startSync(){
  if(SYNC.unsub){ try{ SYNC.unsub(); }catch(e){} SYNC.unsub = null; }
  const cfg = rawGet('sync', {mode:'off'});

  if(SYNC.mode==='off'){ SYNC.on = false; setSyncStatus('off'); return; }
  setSyncStatus('busy');
  SYNC.db = await claude_use('db'); SYNC.user = await claude_use('user');
  if(!SYNC.db){ SYNC.on = false; setSyncStatus('err', 'Sign in to claude.ai on this device to sync.'); return; }
  SYNC.uid = SYNC.user ? await SYNC.user.id() : null;
  if(SYNC.mode==='private' && !SYNC.uid){ SYNC.on = false; setSyncStatus('err', 'Sign in to claude.ai to use private sync.'); return; }
  SYNC.canWrite = true;
  if(SYNC.mode==='team' && SYNC.user && SYNC.user.can){ try{ const c = await SYNC.user.can('data.write'); if(c===false) SYNC.canWrite = false; }catch(e){} }
  SYNC.on = true;

      const remote = assemble(snap.docs);
      if(snap.metadata.fromCache && first){ Object.assign(SYNC.remote, remote); return; }
      if(first){ clearTimeout(timer); first = false;
        if(rawGet('syncPushAll', false)){ localStorage.removeItem('eventora_syncPushAll'); const mt = rawGet('mtime',{}); const now = Date.now(); const ks = syncKeys(); ks.forEach(k=>mt[k]=now); rawSet('mtime', mt); rawSet('syncDirty', ks); }
      }
      applyRemote(remote, false);
      SYNC.lastSync = Date.now();
      if(rawGet('syncDirty', []).length) pushDirty(); else setSyncStatus(SYNC.canWrite ? 'ok' : 'ro', '');
    }, err => { clearTimeout(timer); SYNC.on = false; setSyncStatus('err', err && err.code==='revoked' ? 'Sync access was removed for this view.' : 'Sync stopped. Press Reconnect in Settings.'); });
  }catch(e){ clearTimeout(timer); SYNC.on = false; setSyncStatus('err', 'Could not start sync.'); }
}

/* =========================================================
   LINKED DEVICES (phone + computer with a 6-digit code)
========================================================= */
var LK = {peer:null, conns:{}, link:null, applying:false, timer:null, pending:new Set(), retry:null};
function linkInfo(){ let d = rawGet('devlink', null); if(!d || !d.id){ d = {id:'evt-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36), partners:[]}; rawSet('devlink', d); } return d; }
const peerOpts = () => Object.assign({debug:0}, window.EVT_PEER || {});
const hasPeer = () => typeof Peer !== 'undefined';
const deviceKind = () => /iphone|ipad|android|mobile/i.test(navigator.userAgent) ? 'phone' : 'computer';
function hashNums(s){ let h = 2166136261; for(const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return [h % 90 + 10, (h >>> 8) % 90 + 10, (h >>> 16) % 90 + 10]; }
function snapshot(keys){ const mt = rawGet('mtime', {}), out = {}; (keys || syncKeys()).forEach(k => { const json = localStorage.getItem('eventora_'+k); if(json != null) out[k] = {t: mt[k] || 0, json}; }); return out; }
function linkedCount(){ return linkInfo().partners.length; }
function updateLinkPill(){
  if(ON_CLAUDE) return;
  const pill = document.getElementById('syncPill'); if(!pill) return;
  const n = linkedCount(), on = Object.keys(LK.conns).length;
  pill.className = 'saved ' + (!n ? 's-off' : on ? 's-ok' : 's-busy');
  pill.querySelector('span').textContent = !n ? 'Saved on this device' : on ? 'Linked · in sync' : 'Linked · waiting';
  pill.title = !n ? 'Link your phone in Settings' : on ? 'Your linked device is connected' : 'Changes sync when both devices are open';
  if(current === 'settings') renderSyncSection();
}

/* --- ongoing sync --- */
function startLinkSync(){
  const d = linkInfo(); if(!d.partners.length || !hasPeer() || LK.peer) { updateLinkPill(); return; }
  try{ LK.peer = new Peer(d.id, peerOpts()); }catch(e){ return; }
  LK.peer.on('open', () => { linkInfo().partners.forEach(pid => { if(!LK.conns[pid]) attachConn(LK.peer.connect(pid, {reliable:true})); }); });
  LK.peer.on('connection', c => { if(linkInfo().partners.includes(c.peer)) attachConn(c); else c.close(); });
  LK.peer.on('disconnected', () => { try{ LK.peer.reconnect(); }catch(e){} });
  LK.peer.on('error', err => { if(err && err.type === 'unavailable-id'){ try{ LK.peer.destroy(); }catch(e){} LK.peer = null; setTimeout(startLinkSync, 4000); } });
  clearInterval(LK.retry); LK.retry = setInterval(() => { if(!LK.peer || LK.peer.destroyed || !LK.peer.open) return; linkInfo().partners.forEach(pid => { if(!LK.conns[pid]) attachConn(LK.peer.connect(pid, {reliable:true})); }); }, 15000);
  updateLinkPill();
}
function attachConn(c){
  if(!c) return;
  c.on('open', () => { LK.conns[c.peer] = c; c.send({t:'hello', mt:rawGet('mtime', {})}); updateLinkPill(); });
  c.on('data', m => onLinkData(c, m));
  c.on('close', () => { delete LK.conns[c.peer]; updateLinkPill(); });
  c.on('error', () => { delete LK.conns[c.peer]; updateLinkPill(); });
}
function onLinkData(c, m){
  if(!m) return;
  if(m.t === 'hello'){ const mine = rawGet('mtime', {}), theirs = m.mt || {}; const newer = syncKeys().filter(k => (mine[k] || 0) > (theirs[k] || 0)); if(newer.length) c.send({t:'keys', items:snapshot(newer)}); }
  if(m.t === 'keys' && m.items) applyLinkedItems(m.items);
}
function applyLinkedItems(items){
  const mt = rawGet('mtime', {}); const changed = [];
  Object.entries(items).forEach(([k, it]) => {
    if(LOCAL_ONLY.has(k) || !it || typeof it.json !== 'string') return;
    if((mt[k] || 0) >= (it.t || 0) && localStorage.getItem('eventora_'+k) != null) return;
    try{ JSON.parse(it.json); localStorage.setItem('eventora_'+k, it.json); mt[k] = it.t || Date.now(); changed.push(k); }catch(e){}
  });
  rawSet('mtime', mt);
  if(!changed.length) return;
  if(changed.includes('settings')){ CUR = getSettings().currency; applyBrand(); }
  const busy = () => document.getElementById('modalBg').classList.contains('open') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && document.getElementById('content').contains(document.activeElement));
  const go2 = () => { if(busy()){ setTimeout(go2, 2000); return; } refresh(); };
  go2(); toast('Updated from your other device');
}
function linkQueue(k){
  if(ON_CLAUDE || LK.applying || !Object.keys(LK.conns).length) return;
  LK.pending.add(k); clearTimeout(LK.timer);
  LK.timer = setTimeout(() => { const keys = [...LK.pending]; LK.pending.clear(); const items = snapshot(keys); Object.values(LK.conns).forEach(c => { try{ c.send({t:'keys', items}); }catch(e){} }); }, 400);
}

/* --- linking (one time) --- */
function closeLinking(){ if(LK.link && LK.link.peer){ try{ LK.link.peer.destroy(); }catch(e){} } clearTimeout(LK.link && LK.link.timeout); LK.link = null; }
function linkModal(html){ openModal(`<div class="modal-card sm" style="width:min(480px,100%)"><div class="m-body" style="padding-top:24px">${html}</div></div>`); }
function linkFail(msg){ closeLinking(); linkModal(`<h3 class="serif" style="font-size:22px;margin-bottom:6px">Not linked yet</h3><p style="color:var(--muted);font-size:13.5px">${esc(msg)}</p><div class="lk-foot"><button class="btn btn-ghost" data-close>Close</button><button class="btn btn-primary" data-lk="menu">Try again</button></div>`); }
function noPeerMsg(){ linkModal(`<h3 class="serif" style="font-size:22px;margin-bottom:6px">Linking needs the internet</h3><p style="color:var(--muted);font-size:13.5px">Open the planner from your link while online, then try again. You can also move your data with a backup file in Settings.</p><div class="lk-foot"><button class="btn btn-ghost" data-close>Close</button></div>`); }
function openLinkMenu(){
  const d = linkInfo(), on = Object.keys(LK.conns).length;
  linkModal(`<div class="eyebrow" style="color:var(--rose)">Your devices</div><h3 class="serif" style="font-size:23px;margin:4px 0 6px">Link your phone and computer</h3>
    <p style="color:var(--muted);font-size:13.5px">One 6-digit code, done in seconds. Then your data stays the same on both.</p>
    <div class="lk-list">
      <button data-lk="host">${ic('link')}<span><b>Link a device</b><small>Show a code here, type it on your other device</small></span></button>
      <button data-lk="guest">${ic('download')}<span><b>Get my data from another device</b><small>Type the code shown on your other device</small></span></button>
      ${d.partners.length ? `<button data-lk="unlink" class="danger">${ic('x')}<span><b>Unlink devices</b><small>${d.partners.length} linked · ${on ? 'connected now' : 'syncs when both are open'}</small></span></button>` : ''}
    </div>
    <div class="lk-foot"><button class="btn btn-ghost" data-close>Close</button></div>`);
}
function startHost(){
  if(!hasPeer()) return noPeerMsg();
  closeLinking();
  const code = String(Math.floor(100000 + Math.random() * 900000));
  const L = LK.link = {role:'host', code, ok:false, remoteOk:false};
  linkModal(`<div class="eyebrow" style="color:var(--rose)">Link your phone and computer</div><h3 class="serif" style="font-size:23px;margin:4px 0 10px">Your link code</h3>
    <ol class="lk-steps"><li>On your other device, open <b>${esc(location.host || 'the planner')}</b>.</li><li>Go to <b>Settings → Link devices → Get my data from another device</b>.</li><li>Type this code:</li></ol>
    <div class="lk-code" aria-label="Code ${code.split('').join(' ')}">${code.slice(0,3)} ${code.slice(3)}</div>
    <p style="text-align:center;color:var(--muted);font-size:13px" id="lkStatus">Waiting for your other device…</p>
    <div class="lk-foot"><button class="btn btn-ghost" data-lk="cancel">Cancel</button></div>`);
  try{ L.peer = new Peer('evt-link-' + code, peerOpts()); }catch(e){ return linkFail('Couldn’t start linking. Check your internet and try again.'); }
  L.peer.on('error', err => { if(err && err.type === 'unavailable-id') return startHost(); if(LK.link === L) linkFail('Couldn’t connect. Make sure both devices are online, then try again.'); });
  L.peer.on('connection', c => { if(L.conn) return c.close(); L.conn = c; c.on('data', m => onLinkMsg(L, m)); });
  L.timeout = setTimeout(() => { if(LK.link === L && !L.conn) linkFail('The code expired. Tap Link a device to get a new one.'); }, 10 * 60 * 1000);
}
function openCodeEntry(err){
  linkModal(`<h3 class="serif" style="font-size:22px;margin-bottom:6px">Get your data from another device</h3>
    <p style="color:var(--muted);font-size:13.5px">On the device that has your data, open <b>Settings → Link devices → Link a device</b>. Type the 6-digit code it shows.</p>
    <div class="warn-box" style="background:var(--amber-soft);color:var(--amber);margin:12px 0 4px">${ic('alert')}<span>This replaces everything on this device with the data from your other device.</span></div>
    <form id="lkForm" novalidate><input id="lkCode" class="lk-input" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000" aria-label="6-digit code"><p style="color:var(--red);font-size:12.5px;min-height:18px;text-align:center">${err ? esc(err) : ''}</p>
    <div class="lk-foot"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn btn-primary">Continue</button></div></form>`);
  setTimeout(() => document.getElementById('lkCode')?.focus(), 50);
  document.getElementById('lkForm').addEventListener('submit', e => { e.preventDefault(); const v = document.getElementById('lkCode').value.replace(/\D/g, ''); if(v.length !== 6) return openCodeEntry('Please type all 6 digits.'); startGuest(v); });
}
function startGuest(code){
  if(!hasPeer()) return noPeerMsg();
  closeLinking();
  const L = LK.link = {role:'guest', code, ok:false, remoteOk:false};
  linkModal(`<h3 class="serif" style="font-size:22px;margin-bottom:6px">Connecting…</h3><p style="color:var(--muted);font-size:13.5px" id="lkStatus">Looking for your other device.</p><div class="lk-foot"><button class="btn btn-ghost" data-lk="cancel">Cancel</button></div>`);
  try{ L.peer = new Peer(peerOpts()); }catch(e){ return linkFail('Couldn’t start linking. Check your internet and try again.'); }
  L.peer.on('open', () => { const c = L.conn = L.peer.connect('evt-link-' + code, {reliable:true}); c.on('open', () => c.send({t:'hello', id:linkInfo().id})); c.on('data', m => onLinkMsg(L, m)); });
  L.peer.on('error', err => { if(LK.link !== L) return; linkFail(err && err.type === 'peer-unavailable' ? 'No device found with that code. Check the code on your other device and try again.' : 'Couldn’t connect. Make sure both devices are online, then try again.'); });
  L.timeout = setTimeout(() => { if(LK.link === L && !L.checked) linkFail('Couldn’t connect. Make sure both devices are online with the planner open, then try again.'); }, 20000);
}
function onLinkMsg(L, m){
  if(!m || LK.link !== L) return;
  if(m.t === 'hello' && L.role === 'host'){ L.other = m.id; L.conn.send({t:'hi', id:linkInfo().id}); showCheck(L); }
  if(m.t === 'hi' && L.role === 'guest'){ L.other = m.id; showCheck(L); }
  if(m.t === 'ok'){ L.remoteOk = true; maybeFinish(L); }
  if(m.t === 'no') linkFail('Linking was cancelled because the numbers didn’t match. Please start again.');
  if(m.t === 'full' && L.role === 'guest'){
    const d = linkInfo(); if(!d.partners.includes(L.other)) d.partners.push(L.other); rawSet('devlink', d);
    LK.applying = true;
    syncKeys().forEach(k => { if(!m.items[k]) localStorage.removeItem('eventora_'+k); });
    const mt = {}; Object.entries(m.items || {}).forEach(([k, it]) => { if(LOCAL_ONLY.has(k)) return; try{ localStorage.setItem('eventora_'+k, it.json); mt[k] = it.t || Date.now(); }catch(e){} });
    rawSet('mtime', mt); ['seeded','seed3','seed4','seed5','seed6','seed7','seed8','seed9','seed10'].forEach(k => rawSet(k, true));
    LK.applying = false; CUR = getSettings().currency; applyBrand();
    L.conn.send({t:'done'}); linkDone();
  }
  if(m.t === 'done' && L.role === 'host'){ const d = linkInfo(); if(!d.partners.includes(L.other)) d.partners.push(L.other); rawSet('devlink', d); linkDone(); }
}
function showCheck(L){
  L.checked = true; clearTimeout(L.timeout);
  const n = hashNums(L.code + [linkInfo().id, L.other].sort().join('|'));
  linkModal(`<div class="eyebrow" style="color:var(--rose)">Almost there</div><h3 class="serif" style="font-size:23px;margin:4px 0 6px">Check the numbers</h3>
    <p style="color:var(--muted);font-size:13.5px">Your other device is showing numbers too. Continue only if they’re exactly the same.</p>
    <div class="lk-nums">${n.map(x => `<span>${x}</span>`).join('')}</div>
    <p style="text-align:center;color:var(--muted);font-size:13px" id="lkStatus"></p>
    <div class="lk-foot"><button class="btn btn-ghost" data-lk="nomatch">They don’t match</button><button class="btn btn-primary" data-lk="match">${ic('checkSm')}They match</button></div>`);
}
function maybeFinish(L){
  if(!(L.ok && L.remoteOk)){ if(L.ok){ const s = document.getElementById('lkStatus'); if(s) s.textContent = 'Waiting for you to tap “They match” on your other device…'; } return; }
  if(L.role === 'host'){ const mt = rawGet('mtime', {}); const now = Date.now(); syncKeys().forEach(k => { if(!mt[k]) mt[k] = now; }); rawSet('mtime', mt); L.conn.send({t:'full', items:snapshot()}); }
}
function linkDone(){
  const L = LK.link; const where = L && L.role === 'host' ? 'your other device' : 'this device';
  setTimeout(() => { closeLinking(); if(LK.peer){ try{ LK.peer.destroy(); }catch(e){} LK.peer = null; } startLinkSync(); }, 600);
  linkModal(`<div class="lk-done">${ic('checkSm')}</div><h3 class="serif" style="font-size:24px;text-align:center">Linked!</h3>
    <p style="color:var(--muted);font-size:13.5px;text-align:center">Your data is now on ${where}. While both are open, changes show up on the other one within seconds.</p>
    <div class="lk-foot" style="justify-content:center"><button class="btn btn-primary" data-close>Done</button></div>`);
  refresh(); updateLinkPill();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-lk]'); if(!el) return;
  const a = el.dataset.lk;
  if(a === 'menu') return openLinkMenu();
  if(a === 'host') return startHost();
  if(a === 'guest') return openCodeEntry();
  if(a === 'cancel'){ closeLinking(); return closeModal(); }
  if(a === 'match' && LK.link){ LK.link.ok = true; el.disabled = true; LK.link.conn.send({t:'ok'}); return maybeFinish(LK.link); }
  if(a === 'nomatch' && LK.link){ try{ LK.link.conn.send({t:'no'}); }catch(x){} return linkFail('You said the numbers didn’t match, so nothing was linked. Please start again.'); }
  if(a === 'unlink'){ const d = linkInfo(); d.partners = []; rawSet('devlink', d); Object.values(LK.conns).forEach(c => { try{ c.close(); }catch(x){} }); LK.conns = {}; if(LK.peer){ try{ LK.peer.destroy(); }catch(x){} LK.peer = null; } closeModal(); updateLinkPill(); refresh(); return toast('Devices unlinked. Each keeps its own copy.'); }
});

/* =========================================================
   PLACEHOLDER PAGES
========================================================= */
function renderPlaceholder(key){
  const p = PAGES[key];
  const tones = ['t-rose','t-plum','t-emerald','t-amber','t-sky'];
  const tone = tones[(p.step||1) % tones.length];
  document.getElementById('content').innerHTML = `
    <div class="ph fade">
      <div class="chip ${tone}">${ic(p.icon)}</div>
      <h3>${p.label}</h3>
      <p>${PAGE_DESC[key]||''}</p>
      <span class="tag ${tone}">Coming in Step ${p.step}</span>
    </div>`;
}

/* =========================================================
   NOTIFICATIONS, THEME, SEARCH, TOASTS
========================================================= */
function updateBell(alerts){
  alerts = alerts || buildAlerts(store.get('events',[]), store.get('tasks',[]));
  const btn = document.getElementById('bellBtn');
  btn.innerHTML = ic('bell') + (alerts.length ? `<span class="dot">${alerts.length}</span>` : '');
  document.getElementById('bellDrop').innerHTML = `
    <h4>Notifications <span class="count-pill t-rose">${alerts.length} new</span></h4>
    <div class="alerts">${alerts.map(a => `<div class="alert"><span class="chip t-${a.lvl}">${ic(a.icon)}</span><div><b>${esc(a.title)}</b><span>${esc(a.sub)}</span></div></div>`).join('') || '<div class="empty">You are all caught up.</div>'}</div>`;
}

function setTheme(t){
  document.documentElement.dataset.theme = t;
  store.set('theme', t);
  document.getElementById('themeBtn').innerHTML = ic(t==='dark' ? 'sun' : 'moon');
  if(current==='dashboard'){ destroyCharts(); drawCharts(store.get('events',[])); }
}

function toast(msg, action){
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = ic('spark') + `<span>${msg}</span>` + (action ? `<button class="t-act">${action.label}</button>` : '');
  document.getElementById('toasts').appendChild(el);
  if(action) el.querySelector('.t-act').onclick = () => { action.fn(); el.remove(); };
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, action ? 6000 : 2600);
}

function copyCSV(){
  const events = store.get('events', []);
  const head = ['Event','Type','Client','Date','Status','Venue','Budget','Collected','Invited','Confirmed'];
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = [head.join(','), ...events.map(e => [e.name,e.type,e.client,e.date,e.status,e.venue,e.budget,e.collected,e.invited,e.confirmed].map(q).join(','))].join('\n');
  try{ navigator.clipboard.writeText(csv).then(()=>toast('CSV copied — paste it into Excel or Google Sheets'), ()=>toast('Copy was blocked by the browser')); }
  catch(e){ toast('Copy was blocked by the browser'); }
}

// Command palette
let palItems = [], palSel = 0;
function openPalette(){
  document.getElementById('palBg').classList.add('open');
  const inp = document.getElementById('palInput'); inp.value=''; renderPalette(''); setTimeout(()=>inp.focus(), 30);
}
function closePalette(){ document.getElementById('palBg').classList.remove('open'); }
function renderPalette(q){
  q = q.trim().toLowerCase();
  const events = store.get('events', []);
  const pages = Object.values(PAGES).filter(p => !q || p.label.toLowerCase().includes(q));
  const evs = events.filter(e => !q || [e.name,e.client,e.venue,e.type].join(' ').toLowerCase().includes(q)).slice(0,6);
  palItems = [...pages.map(p=>({kind:'page', p})), ...evs.map(e=>({kind:'event', e}))];
  palSel = 0;
  let html = '';
  if(pages.length) html += `<div class="pal-sec">Pages</div>` + pages.map((p,i)=>`<div class="pal-item" data-i="${i}"><span class="chip t-plum">${ic(p.icon)}</span>${p.label}<span>${p.group}</span></div>`).join('');
  if(evs.length) html += `<div class="pal-sec">Events</div>` + evs.map((e,i)=>`<div class="pal-item" data-i="${pages.length+i}"><span class="chip t-rose">${ic('events')}</span>${esc(e.name)}<span>${esc(e.client)} · ${fmtDate(e.date)}</span></div>`).join('');
  document.getElementById('palList').innerHTML = html || '<div class="empty">No results</div>';
  highlightPal();
}
function highlightPal(){ document.querySelectorAll('.pal-item').forEach(el => el.classList.toggle('sel', +el.dataset.i===palSel)); document.querySelector('.pal-item.sel')?.scrollIntoView({block:'nearest'}); }
function choosePal(i){
  const it = palItems[i]; if(!it) return;
  closePalette();
  if(it.kind==='page') go(it.p.key);
  else go('event:'+it.e.id);
}

/* =========================================================
   EVENTS (global listeners)
========================================================= */
document.addEventListener('click', e => {
  const grp = e.target.closest('[data-group]'); if(grp){ const g = grp.dataset.group; collapsed.has(g) ? collapsed.delete(g) : collapsed.add(g); store.set('collapsed', [...collapsed]); renderNav(); return; }
  const nav = e.target.closest('[data-page]'); if(nav){ go(nav.dataset.page); return; }
  const g = e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  if(e.target.closest('[data-new]')){ openEventForm(); return; }
  if(e.target.closest('[data-close]') || e.target.id==='modalBg'){ closeModal(); return; }
  const act = e.target.closest('[data-act]');
  if(act){ const id = act.dataset.id; ({open:()=>go('event:'+id), edit:()=>openEventForm(id), delete:()=>deleteEvent(id), duplicate:()=>duplicateEvent(id)})[act.dataset.act]?.(); return; }
  const tk = e.target.closest('[data-task]');
  if(tk){ tk.dataset.op==='toggle' ? toggleTask(tk.dataset.task) : removeTask(tk.dataset.task); return; }
  const dt = e.target.closest('[data-dtab]'); if(dt){ evTab = dt.dataset.dtab; refresh(); return; }
  const vw = e.target.closest('[data-view]'); if(vw){ evView = vw.dataset.view; store.set('evView', evView); renderEvents(); return; }
  const et = e.target.closest('[data-evtab]'); if(et){ evStatus = et.dataset.evtab; renderEventsBody(); return; }
  const op = e.target.closest('[data-open]'); if(op){ go('event:'+op.dataset.open); return; }
  const soon = e.target.closest('[data-soon]'); if(soon){ toast(soon.dataset.soon); return; }
  const tab = e.target.closest('[data-tab]'); if(tab){ tableFilter = tab.dataset.tab; renderTable(); return; }
  const pi = e.target.closest('.pal-item'); if(pi){ choosePal(+pi.dataset.i); return; }
  const drop = document.getElementById('bellDrop');
  if(e.target.closest('#bellBtn')){ drop.classList.toggle('open'); return; }
  if(!e.target.closest('#bellDrop')) drop.classList.remove('open');
  if(e.target.id==='palBg') closePalette();
});
document.getElementById('openSearch').onclick = openPalette;
document.getElementById('palInput').addEventListener('input', e => renderPalette(e.target.value));
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if(e.key==='Escape' && document.getElementById('modalBg').classList.contains('open')){ closeModal(); return; }
  if(!document.getElementById('palBg').classList.contains('open')) return;
  if(e.key==='Escape') closePalette();
  if(e.key==='ArrowDown'){ e.preventDefault(); palSel = Math.min(palSel+1, palItems.length-1); highlightPal(); }
  if(e.key==='ArrowUp'){ e.preventDefault(); palSel = Math.max(palSel-1, 0); highlightPal(); }
  if(e.key==='Enter'){ e.preventDefault(); choosePal(palSel); }
});
document.getElementById('menuBtn').innerHTML = ic('menu');
document.getElementById('menuBtn').onclick = () => document.body.classList.toggle('nav-open');
document.getElementById('overlay').onclick = () => document.body.classList.remove('nav-open');
document.getElementById('themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme==='dark' ? 'light' : 'dark');

/* =========================================================
   INIT
========================================================= */
hydrateIcons(document.body);
document.documentElement.dataset.accent = store.get('accent','plum');
if(store.get('textSize','normal')==='large') document.documentElement.dataset.text = 'large';
document.getElementById('paletteBtn').innerHTML = ic('palette');
applyBrand();
document.documentElement.dataset.theme = store.get('theme', 'light');
document.getElementById('themeBtn').innerHTML = ic(document.documentElement.dataset.theme==='dark' ? 'sun' : 'moon');
APP_READY = true;
go('dashboard');
if(ON_CLAUDE){ if((rawGet('sync',{mode:'off'}).mode||'off')!=='off') startSync(); else setSyncStatus('off'); }
else { setSyncStatus('off'); startLinkSync(); updateLinkPill(); }
